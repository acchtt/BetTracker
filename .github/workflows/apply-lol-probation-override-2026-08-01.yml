name: Apply LoL probation override

on:
  push:
    branches: [main]
    paths:
      - overrides/LOL_PROBATION_OVERRIDE_2026-08-01.json

permissions:
  contents: write

jobs:
  apply-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include specified official LoL wagers in probation
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          override_path = Path("overrides/LOL_PROBATION_OVERRIDE_2026-08-01.json")
          status_path = Path("probation/LOL_PROBATION_STATUS_2026-08-01.json")

          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          override = json.loads(override_path.read_text(encoding="utf-8"))
          entries = {item["syncId"]: item for item in override["entries"]}

          found = set()
          for bet in ledger.get("bets", []):
              sync_id = bet.get("syncId")
              if sync_id not in entries:
                  continue
              found.add(sync_id)
              item = entries[sync_id]
              eligibility = bet.setdefault("probationEligibility", {})
              eligibility.update({
                  "probationActive": True,
                  "countsTowardTenWagerValidation": True,
                  "status": "included by explicit user-directed exception",
                  "probationSequenceNumber": item["probationSequenceNumber"],
                  "result": bet.get("status"),
                  "probationRecordAfterSettlement": item["probationRecordAfterSettlement"],
                  "probationNetVndAfterSettlement": item["probationNetVndAfterSettlement"],
                  "probationNetUnitsAfterSettlement": item["probationNetUnitsAfterSettlement"],
                  "inclusionBasis": "User explicitly requested inclusion in the active ten-wager probation despite recorded execution-validity or stake-cap deviations.",
                  "deviationsPreserved": True,
                  "reason": item["reason"]
              })

              execution = bet.setdefault("execution", {})
              execution["performanceAttribution"] = (
                  "official settled wager included in probation by explicit user-directed exception; "
                  "all execution-validity, price-move, and stake-cap deviations remain recorded"
              )

              tags = bet.setdefault("tags", [])
              tags = [tag for tag in tags if tag != "excluded-from-probation"]
              for tag in [
                  "probation-user-override",
                  f"probation-wager-{item['probationSequenceNumber']}",
                  "execution-deviations-preserved"
              ]:
                  if tag not in tags:
                      tags.append(tag)
              bet["tags"] = tags

              note = (
                  " User later explicitly requested that this official wager be included in the active "
                  "ten-wager probation. Inclusion is a user-directed exception and does not erase the "
                  "recorded execution or stake deviations."
              )
              if note.strip() not in bet.get("notes", ""):
                  bet["notes"] = bet.get("notes", "") + note
              bet["updatedAt"] = override["updatedAt"]

          missing = set(entries) - found
          if missing:
              raise RuntimeError(f"Missing ledger entries: {sorted(missing)}")

          ledger["version"] = override["ledgerVersion"]
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status_path.parent.mkdir(parents=True, exist_ok=True)
          status = {
              "version": override["updatedAt"],
              "sport": "League of Legends",
              "probationTarget": 10,
              "completed": 4,
              "remaining": 6,
              "record": "1-3",
              "netVnd": -601250,
              "netUnits": -0.60125,
              "inclusionPolicy": "All four official LoL wagers placed on 2026-08-01 are included. Wagers 3 and 4 are explicit user-directed exceptions; their execution deviations remain preserved.",
              "wagers": override["entries"]
          }
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit probation override
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.json probation/LOL_PROBATION_STATUS_2026-08-01.json
          if ! git diff --cached --quiet; then
            git commit -m "Include TES and DK LoL wagers in probation by user override"
            git push
          fi
