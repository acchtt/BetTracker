name: Add football over-price calibration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-football-over-price-calibration.yml

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add v0.2.7 pricing rule and procedure updates
        shell: python
        run: |
          from pathlib import Path

          rules_path = Path("MODEL_RULES_FOOTBALL_V0.2.7.md")
          procedure_path = Path("FOOTBALL_BETTING_PROCEDURE.md")
          changelog_path = Path("MODEL_CHANGELOG.md")

          rules = '''# Football Model Rules v0.2.7

**Effective date:** 2026-07-30  
**Status:** Active evaluation rule  
**Supersedes:** `MODEL_RULES_FOOTBALL_V0.2.6.md` only where total-market price extraction, over-value detection, adjacent-line comparison, or market-implied goal distributions conflict. v0.2.6 remains the active knockout-state and chance-correlation layer.

## Trigger

Live total screens can offer an over price that is materially longer than the state-based fair price, particularly after a quiet period, a low current score, or market anchoring to recent under outcomes. The existing procedure required independent line pricing but did not force the model to extract the bookmaker's implied remaining-goal distribution, compare adjacent lines, or quantify when an over price was unusually generous.

## Active rules

### 1. Discrete remaining-goal distribution

For every live total assessment, estimate the probability of each relevant remaining-goal bucket through regulation stoppage time:

- `P0`: no additional goals;
- `P1`: exactly one additional goal;
- `P2`: exactly two additional goals;
- `P3`: exactly three additional goals;
- `P4+`: four or more additional goals.

Do not price an over from a single expected-goals mean alone. The distribution must incorporate score state, effective time remaining, lineups, substitutions, cards, chance quality, persistence, competition incentives, aggregate state, and likely stoppage time.

### 2. Exact settlement-weight expected value

For each displayed Asian total, calculate expected value across all settlement outcomes rather than using only `1 / odds`.

Let `o` be decimal odds and let each goal bucket have settlement profit `r_k(o)` per unit staked. Then:

`EV(o) = sum(Pk * r_k(o))`

The fair price is the value of `o` for which `EV(o) = 0`.

Examples for an over on additional goals:

- Over 0.75: `EV = (o-1) * (P2+ + 0.5*P1) - P0`;
- Over 1.25: `EV = (o-1) * P2+ - P0 - 0.5*P1`;
- Over 1.75: `EV = (o-1) * (P3+ + 0.5*P2) - (P0+P1)`;
- Over 2.0: `EV = (o-1) * P3+ - (P0+P1)` with `P2` a push;
- Over 2.25: `EV = (o-1) * P3+ - (P0+P1) - 0.5*P2`.

Use the equivalent exact payout matrix for every other quarter, half, or whole line.

### 3. Same-line no-vig market reference

When both over and under prices are visible at the same line, calculate a quick no-vig market reference:

- `q_over = 1 / over_odds`;
- `q_under = 1 / under_odds`;
- `p_over_market = q_over / (q_over + q_under)`;
- `p_under_market = q_under / (q_over + q_under)`.

For whole-goal and quarter-goal lines, this normalized pair is only a market reference because pushes, half wins, and half losses require the full settlement distribution.

### 4. Adjacent-line coherence check

Compare all available adjacent lines, normally the nearest quarter, half, and three-quarter totals.

- Infer the goal distribution implied by the neighboring prices when enough lines are available.
- Use a Poisson or state-adjusted count model only as a consistency benchmark, not as the final probability model.
- Check that implied over probabilities decrease coherently as the total rises.
- Flag a line when its offered over odds are materially longer than both the model fair price and the neighboring-line structure imply.
- Reprice every changed line independently; do not transfer value from one total to another.

### 5. Over-price value fields

Whenever an over is considered, report:

- offered over odds;
- model fair odds;
- same-line no-vig market reference when available;
- exact expected ROI after settlement weighting;
- offered-price premium versus model fair price;
- adjacent-line comparison;
- the most efficient over line and the reason it is preferred.

Use the label `over-price value` only when the offered price is longer than the model fair price and the edge survives uncertainty, settlement, and state-transition adjustments.

### 6. High odds are not evidence

A large decimal price does not create value by itself. An over remains `NO BET` when the long price correctly reflects weak chance quality, limited time, compact defending, aggregate-reset risk, missing data, or poor persistence.

The active five-percentage-point official edge threshold remains in force. Stricter market-specific and knockout thresholds still apply.

### 7. Adjacent-line selection

Price each available over line separately. Select the line with the best uncertainty-adjusted expected value, not automatically the highest odds.

When adjacent lines have expected values within approximately two percentage points, prefer the line with better protection in the most likely adverse goal bucket. This extends the Bragantino adjacent-line review without treating that single result as proof of a universal preference.

### 8. Required output and tags

For total-goal recommendations where an over is available, include an `Over-price check` section.

Use tags when applicable:

- `over-price-check`;
- `market-implied-distribution`;
- `adjacent-line-value`;
- `settlement-weighted-ev`.

## Expected benefit

Detect overs whose prices are too long relative to the modeled goal distribution, reduce an unintended bias toward unders after quiet periods, and improve line selection across quarter, half, and whole totals.

## Possible downside

Live prices can move before the calculation is complete. Sparse adjacent lines, bookmaker margin, state changes, and Poisson misspecification can create false dislocation signals. The faster live format should therefore show the actionable decision first and the pricing table immediately afterward.

## Review threshold

Review after 20 fully documented football over opportunities assessed under v0.2.7 or after 10 settled official football over wagers, whichever occurs first. Track model fair odds, offered odds, no-vig market reference, expected ROI, adjacent-line residual, closing-line quality, settlement bucket, calibration, and realized ROI.
'''
          rules_path.write_text(rules, encoding="utf-8")

          procedure = procedure_path.read_text(encoding="utf-8")
          procedure = procedure.replace(
              "`MODEL_CHANGELOG.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, `MODEL_RULES_FOOTBALL_V0.2.5.md`, and `ledger.json`",
              "`MODEL_CHANGELOG.md`, `MODEL_RULES_FOOTBALL_V0.2.7.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, `MODEL_RULES_FOOTBALL_V0.2.5.md`, and `ledger.json`"
          )
          procedure = procedure.replace(
              "Where v0.2.6 conflicts with an older aggregate-state interpretation, v0.2.6 controls.",
              "Where v0.2.7 conflicts with older total-market pricing or over-value interpretation, v0.2.7 controls. Where v0.2.6 conflicts with an older aggregate-state interpretation, v0.2.6 controls."
          )

          pricing_block = '''### Over-price and market-implied distribution check

Whenever an over line is displayed:

1. Build a discrete remaining-goal distribution for 0, 1, 2, 3, and 4+ goals through regulation stoppage time.
2. Calculate exact settlement-weighted expected value and fair odds for every nearby over line, including full wins, half wins, pushes, half losses, and full losses.
3. When both sides are visible, remove the same-line overround to obtain a no-vig market reference.
4. Compare adjacent quarter, half, and whole lines for coherence and identify whether one over price is unusually long relative to the neighboring structure.
5. Report offered odds, model fair odds, expected ROI, price premium, adjacent-line comparison, and the preferred line.
6. Treat a high price only as an invitation to calculate; it is not evidence of value by itself.
7. Apply the normal five-point official edge threshold and every stricter market-specific or knockout buffer after the over-price calculation.

When adjacent lines have expected values within approximately two percentage points, prefer protection in the most likely adverse goal bucket.

'''
          marker = "Under the active football restriction:\n"
          if "### Over-price and market-implied distribution check" not in procedure:
              procedure = procedure.replace(marker, pricing_block + marker)

          procedure = procedure.replace(
              "- fair-price range;\n- concise evidence;",
              "- fair-price range;\n- `Over-price check` for total markets when an over is displayed;\n- concise evidence;"
          )
          procedure = procedure.replace(
              "- `chance-cluster-adjusted`\n- `stoppage-time-risk`",
              "- `chance-cluster-adjusted`\n- `over-price-check`\n- `market-implied-distribution`\n- `adjacent-line-value`\n- `settlement-weighted-ev`\n- `stoppage-time-risk`"
          )
          procedure = procedure.replace(
              "Follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_CHANGELOG.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, and the base rules",
              "Follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_CHANGELOG.md`, `MODEL_RULES_FOOTBALL_V0.2.7.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, and the base rules"
          )
          procedure = procedure.replace(
              "Run the mandatory competition-context, lineup, aggregate-state, goals-required-tier, next-goal-state-tree, aggregate-reset, chance-correlation, late-game, and stoppage-time modules.",
              "Run the mandatory competition-context, lineup, aggregate-state, goals-required-tier, next-goal-state-tree, aggregate-reset, chance-correlation, over-price, adjacent-line, late-game, and stoppage-time modules."
          )
          checklist_marker = "- [ ] Each changed line priced independently\n"
          if "Market-implied over probability" not in procedure:
              procedure = procedure.replace(
                  checklist_marker,
                  checklist_marker + "- [ ] Market-implied over probability and same-line overround checked when both sides are available\n- [ ] Exact settlement-weighted EV calculated for adjacent over lines\n- [ ] `Over-price check` completed when an over is considered\n"
              )
          procedure_path.write_text(procedure, encoding="utf-8")

          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = changelog.replace(
              "Football recommendations must follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, and this changelog. `MODEL_RULES_FOOTBALL_V0.2.5.md` remains the base aggregate-state rule where v0.2.6 does not override it.",
              "Football recommendations must follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_RULES_FOOTBALL_V0.2.7.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, and this changelog. `MODEL_RULES_FOOTBALL_V0.2.5.md` remains the base aggregate-state rule where v0.2.6 does not override it."
          )

          changelog_entry = '''## v0.2.7 — 2026-07-30

### Football over-price detection and market-implied goal distribution

**Status:** Active evaluation rule  
**Detailed implementation:** `MODEL_RULES_FOOTBALL_V0.2.7.md`, with v0.2.6 retained for knockout state transitions and correlated live evidence.

**Sport and markets affected**

Football prematch and live total-goal markets, especially Asian quarter, half, and whole-goal overs with multiple adjacent lines displayed.

**Triggering evidence**

- The user identified that a displayed over price can sometimes be materially longer than the match state justifies and requested that the model calculate this rather than defaulting toward an under interpretation.
- Recent reviews showed the importance of comparing neighboring lines and exact settlement buckets: Bragantino Under 1.25 and Under 1.5 had close expected value but different one-goal payouts, while Lech Over 3 demonstrated the value of whole-goal boundary protection.
- The prior procedure required independent market pricing but did not force extraction of the bookmaker's implied goal distribution, no-vig over probability, adjacent-line consistency, or exact over-price premium.

**Previous rule**

The model estimated fair odds and compared nearby lines, but over-value detection was mostly embedded in the general recommendation. It did not require a discrete 0/1/2/3/4+ goal distribution, a same-line no-vig reference, or a formal adjacent-line residual for every over candidate.

**New rule**

- Build a discrete remaining-goal distribution through regulation stoppage time before pricing a live over.
- Calculate exact settlement-weighted expected value for each quarter, half, and whole-goal line.
- Remove same-line overround when both over and under odds are visible to obtain a market reference.
- Compare neighboring lines and flag over odds that are longer than both the model fair price and the adjacent-line structure imply.
- Report offered odds, model fair odds, no-vig market reference, expected ROI, price premium, and preferred adjacent line in an `Over-price check` section.
- Do not treat high decimal odds as evidence. The edge must survive chance-quality, persistence, competition, state-transition, settlement, and uncertainty adjustments.
- Keep the existing five-point official edge gate and every stricter market-specific or knockout threshold.
- When adjacent lines have expected values within approximately two percentage points, prefer better protection in the most likely adverse goal bucket.

**Expected benefit**

Identify genuinely generous over prices, reduce one-sided under bias after quiet scoreboards, and improve selection between adjacent Asian total lines.

**Possible downside**

The calculation may slow live execution, and sparse lines, bookmaker margin, rapid state changes, or an overly simple count model can produce false price-dislocation signals.

**Review threshold**

Review after 20 fully documented football over opportunities under v0.2.7 or 10 settled official football over wagers, whichever occurs first. Track fair odds, offered odds, no-vig market reference, expected ROI, adjacent-line residual, closing-line quality, settlement bucket, calibration, and ROI.

---

'''
          insert_marker = "## v0.2.6 — 2026-07-30\n"
          if "## v0.2.7 — 2026-07-30" not in changelog:
              changelog = changelog.replace(insert_marker, changelog_entry + insert_marker)
          changelog_path.write_text(changelog, encoding="utf-8")

      - name: Commit model update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add MODEL_RULES_FOOTBALL_V0.2.7.md FOOTBALL_BETTING_PROCEDURE.md MODEL_CHANGELOG.md
          git commit -m "Add football over-price calibration v0.2.7" || exit 0
          git push
