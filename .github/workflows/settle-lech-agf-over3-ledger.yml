name: Settle Lech AGF ledger entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/settle-lech-agf-over3-ledger.yml

permissions:
  contents: write

jobs:
  settle-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update authoritative ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sync_id = "eval-20260729-lech-agf-over-3"
          settled_at = "2026-07-29T18:58:00Z"

          target = next((bet for bet in data.get("bets", []) if bet.get("syncId") == sync_id), None)
          if target is None:
              raise SystemExit(f"Missing ledger entry: {sync_id}")

          target.update({
              "updatedAt": settled_at,
              "status": "push",
              "result": "Lech Poznan 0-3 AGF Aarhus after 90 minutes (Push; Over 3 total goals)",
              "payoutVnd": 125000,
              "netProfitVnd": 0,
              "netUnits": 0.0,
              "settledAt": settled_at,
              "finalRegulationScore": "Lech Poznan 0-3 AGF Aarhus",
              "finalAggregateAfter90": "4-4; match proceeded beyond regulation"
          })

          tags = target.setdefault("tags", [])
          for tag in ["user-confirmed-result", "push", "model-review"]:
              if tag not in tags:
                  tags.append(tag)

          review = (
              " Settlement confirmed by the user: regulation ended Lech Poznan 0-3 AGF Aarhus, so Over 3 pushed. "
              "Payout 125,000 VND; net result 0 VND (0.00u). "
              "Result review: the forced-chase branch occurred strongly enough to produce three total goals, but not a fourth. "
              "Process review: the whole-goal line protection worked exactly as intended at the boundary outcome. "
              "The goals thesis was directionally sound, while the push shows why the model preferred Over 3 rather than a more aggressive quarter-line. "
              "No rule change is promoted from this single settlement."
          )
          if review.strip() not in target.get("notes", ""):
              target["notes"] = target.get("notes", "") + review

          data["version"] = settled_at
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit ledger settlement
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add ledger.json
          git commit -m "Settle Lech AGF Over 3 as push"
          git push
