name: Merge AL TT Game 2 settlement

on:
  push:
    paths:
      - 'pending/2026-08-01-al-tt-game2-under-29-5-kills-open.json'

permissions:
  contents: write

jobs:
  merge-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upsert settled wager into ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          entry_path = Path('pending/2026-08-01-al-tt-game2-under-29-5-kills-open.json')
          ledger_path = Path('ledger.json')
          entry = json.loads(entry_path.read_text(encoding='utf-8'))
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))

          bets = ledger.setdefault('bets', [])
          sync_id = entry['syncId']
          for i, bet in enumerate(bets):
              if bet.get('syncId') == sync_id:
                  bets[i] = entry
                  break
          else:
              bets.insert(0, entry)

          ledger['version'] = '2026-08-01T08:31:00Z'
          metadata = ledger.setdefault('mergeMetadata', {})
          metadata['strategy'] = 'syncId-latest-update'
          sources = metadata.setdefault('pendingSources', [])
          source = str(entry_path)
          if source not in sources:
              sources.append(source)

          ledger_path.write_text(
              json.dumps(ledger, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit authoritative ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git diff --cached --quiet && exit 0
          git commit -m 'Merge AL vs TT Game 2 settlement into ledger'
          git push
