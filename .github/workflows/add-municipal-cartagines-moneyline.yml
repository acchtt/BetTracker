name: Add Municipal Cartagines Moneyline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-municipal-cartagines-moneyline.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add wager to ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = '2026-07-31T02:47:00Z'
          sync_id = 'eval-20260731-municipal-cartagines-moneyline'

          existing = next((b for b in data.get('bets', []) if b.get('syncId') == sync_id), None)
          if existing is None:
              bet = {
                  'syncId': sync_id,
                  'updatedAt': now,
                  'event': 'Municipal vs Cartagines',
                  'league': 'CONCACAF Central American Cup',
                  'competitionStage': 'Group stage, Matchday 1',
                  'format': 'Pre-match full-time 1X2 market; settles after 90 minutes plus regulation stoppage time; extra time and penalties excluded',
                  'bet': 'Municipal moneyline',
                  'odds': 1.92,
                  'stakeVnd': 63000,
                  'stakeUnits': 0.126,
                  'potentialPayoutVnd': 120960,
                  'potentialProfitVnd': 57960,
                  'status': 'pending',
                  'result': 'Pending',
                  'eventDate': '2026-07-31',
                  'marketType': '1X2',
                  'timing': 'prematch',
                  'bookmaker': 'BK8',
                  'slipId': '870860089261707264',
                  'entryScore': '0-0 before kickoff',
                  'entryMinute': 'Pre-match with confirmed lineups',
                  'settlementBasis': 'Municipal must win after 90 minutes plus regulation stoppage time. A draw or Cartagines win loses the wager. Extra time and penalties are excluded.',
                  'modelRecommendation': {
                      'recommendationType': 'lean-small',
                      'modelVersion': 'football-v0.2.10',
                      'market': 'Municipal -0.5 Asian handicap',
                      'quotedOdds': 1.91,
                      'minimumExecutableOdds': 1.88,
                      'stakeUnits': 0.125,
                      'state': 'Pre-match with confirmed lineups.',
                      'reasoning': 'Municipal home advantage and lineup support created a modest positive edge, but cross-league and regional-cup uncertainty prevented OFFICIAL BET status.'
                  },
                  'execution': {
                      'odds': 1.92,
                      'stakeUnits': 0.126,
                      'stakeVnd': 63000,
                      'potentialPayoutVnd': 120960,
                      'marketDisplayed': 'Municipal 1X2 moneyline',
                      'recommendedMarket': 'Municipal -0.5 Asian handicap',
                      'settlementEquivalent': True,
                      'priceBetterThanQuoted': True,
                      'priceAboveMinimumExecutable': True,
                      'withinStakeCap': True,
                      'stakeRoundingDifferenceVnd': 500,
                      'deviations': [],
                      'executionAssessment': 'Municipal 1X2 and Municipal -0.5 are settlement-equivalent for regulation-time grading. The accepted price improved from 1.91 to 1.92. The 63,000 VND stake is a normal sportsbook rounding of the 62,500 VND recommendation.'
                  },
                  'tags': [
                      'evaluation',
                      'official-after-user-confirmation',
                      'football',
                      'concacaf-central-american-cup',
                      'group-stage',
                      'prematch',
                      '1x2',
                      'home-moneyline',
                      'lean-small',
                      'model-v0-2-10',
                      'lineup-confirmed',
                      'regional-cup-uncertainty',
                      'user-executed',
                      'settlement-equivalent-market',
                      'price-better-than-quoted',
                      'within-stake-cap',
                      'user-execution-clean',
                      'pending'
                  ],
                  'notes': 'User confirmed sportsbook acceptance of Municipal 1X2 at 1.92 for 63,000 VND (0.126u), slip #870860089261707264. The model recommendation was LEAN — SMALL Municipal -0.5 at 1.91, executable at 1.88+, for 0.125u. Municipal moneyline and Municipal -0.5 are settlement-equivalent in regulation time, and the accepted price was better. The 500 VND stake difference is normal rounding. Potential payout is 120,960 VND and potential profit is 57,960 VND (+0.11592u).',
                  'placedAt': '2026-07-31T09:47:00+07:00',
                  'userConfirmedAt': '2026-07-31T09:47:00+07:00',
                  'addedAt': now,
                  'createdAt': now
              }
              data.setdefault('bets', []).insert(0, bet)
          else:
              existing['updatedAt'] = now
          data['version'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Record Municipal Cartagines moneyline wager' || exit 0
          git push
