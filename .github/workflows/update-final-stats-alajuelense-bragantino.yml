name: Update Alajuelense and Bragantino final stats

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-final-stats-alajuelense-bragantino.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Settle Alajuelense and revise both reviews
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = '2026-07-30T04:10:00Z'
          data['version'] = now

          by_id = {b.get('syncId'): b for b in data.get('bets', [])}

          ala = by_id['eval-20260730-alajuelense-xelaju-under-1-75']
          ala.update({
              'updatedAt': now,
              'status': 'win',
              'result': 'LD Alajuelense 1-0 CSD Xelaju MC after 90 minutes (Win; Under 1.75 total goals)',
              'finalScore': 'LD Alajuelense 1-0 CSD Xelaju MC',
              'finalTotalGoals': 1,
              'settlementType': 'full_win',
              'payoutVnd': 233750,
              'profitVnd': 108750,
              'profitUnits': 0.2175,
              'netProfitVnd': 108750,
              'netUnits': 0.2175,
              'settledAt': now,
              'finalStats': {
                  'xG': 'Alajuelense 0.63-0.50 Xelaju',
                  'xGOT': 'Alajuelense 0.44-0.14 Xelaju',
                  'possession': 'Alajuelense 54%-46% Xelaju',
                  'shots': 'Alajuelense 15-9 Xelaju',
                  'shotsOnTarget': 'Alajuelense 4-3 Xelaju',
                  'shotsOffTarget': 'Alajuelense 6-5 Xelaju',
                  'blockedShots': 'Alajuelense 5-1 Xelaju',
                  'bigChances': 'Alajuelense 0-1 Xelaju',
                  'shotsInsideBox': 'Alajuelense 6-3 Xelaju',
                  'shotsOutsideBox': 'Alajuelense 9-6 Xelaju',
                  'hitWoodwork': 'Alajuelense 0-1 Xelaju',
                  'boxTouches': 'Alajuelense 17-14 Xelaju',
                  'corners': 'Alajuelense 3-7 Xelaju',
                  'accurateThroughPasses': 'Alajuelense 0-1 Xelaju',
                  'offsides': 'Alajuelense 1-3 Xelaju',
                  'freeKicks': 'Alajuelense 12-17 Xelaju',
                  'passAccuracy': 'Alajuelense 89%-82% Xelaju',
                  'longPassAccuracy': 'Alajuelense 66%-47% Xelaju',
                  'finalThirdPassAccuracy': 'Alajuelense 78%-64% Xelaju',
                  'crossAccuracy': 'Alajuelense 14%-27% Xelaju',
                  'xA': 'Alajuelense 0.36-0.68 Xelaju',
                  'throwIns': 'Alajuelense 19-22 Xelaju',
                  'fouls': 'Alajuelense 17-12 Xelaju',
                  'tackleSuccess': 'Alajuelense 69%-52% Xelaju',
                  'duelsWon': 'Alajuelense 51-48 Xelaju',
                  'clearances': 'Alajuelense 27-19 Xelaju',
                  'interceptions': 'Alajuelense 10-7 Xelaju',
                  'errorsLeadingToShot': 'Alajuelense 1-0 Xelaju',
                  'errorsLeadingToGoal': 'Alajuelense 0-0 Xelaju',
                  'yellowCards': 'Alajuelense 2-2 Xelaju'
              },
              'review': {
                  'resultAssessment': 'The wager won in full because the match finished with exactly one total goal.',
                  'processAssessment': 'The entry was supported by an exceptionally quiet first half: combined xG 0.12, combined xGOT 0.03, two total shots, no big chances and no inside-box shots. The final match became materially more active, finishing with 1.13 combined xG, seven shots on target, one Xelaju big chance, 31 combined box touches and an Xelaju shot off the woodwork. This means the win was not completely comfortable, but Under 1.75 was a sound risk-adjusted line because exactly two goals would have produced only a half loss. Under 1.5 would also have won at the realized score, but the final chance profile reinforces rather than weakens the value of the 1.75 protection.',
                  'lineSelectionAssessment': 'Under 1.75 was preferred to Under 1.5 because it protected the plausible two-goal adverse branch. The final score favored both lines, while the final chance volume shows the protected line was the more robust selection ex ante.'
              }
          })
          for tag in ['user-confirmed-result', 'win', 'settled', 'model-review', 'final-stats-verified', 'good-process']:
              if tag not in ala['tags']:
                  ala['tags'].append(tag)
          ala['notes'] += ' Settlement and final statistics confirmed by the user: Alajuelense won 1-0. Full payout 233,750 VND; net profit 108,750 VND (+0.2175u). Final statistics: xG 0.63-0.50, xGOT 0.44-0.14, shots 15-9, shots on target 4-3, big chances 0-1, inside-box shots 6-3, box touches 17-14, corners 3-7 and woodwork 0-1. The match opened after the entry, so this is classified as a good low-event entry with meaningful line protection rather than an effortless under.'

          bra = by_id['eval-20260730-bragantino-sporting-cristal-under-1-25']
          bra['updatedAt'] = now
          bra['finalStats'] = {
              'xG': 'RB Bragantino 2.08-0.38 Sporting Cristal',
              'xGOT': 'RB Bragantino 0.91-0.95 Sporting Cristal',
              'possession': 'RB Bragantino 56%-44% Sporting Cristal',
              'shots': 'RB Bragantino 23-5 Sporting Cristal',
              'shotsOnTarget': 'RB Bragantino 3-2 Sporting Cristal',
              'shotsOffTarget': 'RB Bragantino 14-2 Sporting Cristal',
              'blockedShots': 'RB Bragantino 6-1 Sporting Cristal',
              'bigChances': 'RB Bragantino 2-1 Sporting Cristal',
              'shotsInsideBox': 'RB Bragantino 11-4 Sporting Cristal',
              'shotsOutsideBox': 'RB Bragantino 12-1 Sporting Cristal',
              'hitWoodwork': 'RB Bragantino 3-0 Sporting Cristal',
              'headedGoals': 'RB Bragantino 1-0 Sporting Cristal',
              'boxTouches': 'RB Bragantino 24-8 Sporting Cristal',
              'corners': 'RB Bragantino 11-0 Sporting Cristal',
              'accurateThroughPasses': 'RB Bragantino 1-0 Sporting Cristal',
              'offsides': 'RB Bragantino 2-1 Sporting Cristal',
              'freeKicks': 'RB Bragantino 8-23 Sporting Cristal',
              'passAccuracy': 'RB Bragantino 84%-70% Sporting Cristal',
              'longPassAccuracy': 'RB Bragantino 62%-31% Sporting Cristal',
              'finalThirdPassAccuracy': 'RB Bragantino 74%-40% Sporting Cristal',
              'crossAccuracy': 'RB Bragantino 20%-25% Sporting Cristal',
              'xA': 'RB Bragantino 1.18-0.47 Sporting Cristal',
              'throwIns': 'RB Bragantino 20-20 Sporting Cristal',
              'fouls': 'RB Bragantino 23-8 Sporting Cristal',
              'tackleSuccess': 'RB Bragantino 50%-50% Sporting Cristal',
              'duelsWon': 'RB Bragantino 33-53 Sporting Cristal',
              'clearances': 'RB Bragantino 15-25 Sporting Cristal',
              'interceptions': 'RB Bragantino 16-7 Sporting Cristal',
              'errorsLeadingToShot': 'RB Bragantino 0-0 Sporting Cristal',
              'yellowCards': 'RB Bragantino 4-3 Sporting Cristal',
              'redCards': 'RB Bragantino 0-1 Sporting Cristal'
          }
          bra['review']['processAssessment'] = 'The halftime low-quality read was reasonable, but the final statistics show the edge was overstated. The match finished with 2.46 combined xG, 1.86 combined xGOT, three big chances, 15 inside-box shots, 32 opposition-box touches, 11 corners and three Bragantino shots off the woodwork. Sporting Cristal also received a red card, which materially changed the state and increased one-sided Bragantino pressure. The Under 1.25 produced a half win, but it survived a substantial two-or-more-goal tail and should be classified as a profitable result with mixed process rather than a comfortable low-event success. Under 1.5 offered better protection in the realized one-goal branch, although the final chance profile means even that alternative was not low risk.'
          bra['review']['finalStatsAssessment'] = 'Bragantino generated 2.08 xG from 23 shots, 11 inside-box attempts, 24 box touches, 11 corners and three woodwork hits. Sporting Cristal generated only 0.38 xG but 0.95 xGOT, two shots on target and one big chance. The 1-0 score materially understated the match danger.'
          for tag in ['final-stats-verified', 'process-mixed', 'red-card-state-change', 'high-post-entry-chance-volume']:
              if tag not in bra['tags']:
                  bra['tags'].append(tag)
          bra['notes'] += ' Final statistics supplied by the user: xG 2.08-0.38, xGOT 0.91-0.95, shots 23-5, shots on target 3-2, big chances 2-1, inside-box shots 11-4, box touches 24-8, corners 11-0, woodwork 3-0 and red cards 0-1. These figures revise the process classification from a comfortable low-event read to a mixed-process half win: the final 1-0 score understated the two-goal risk.'

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Settle Alajuelense and add verified final stats' || exit 0
          git push
