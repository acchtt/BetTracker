name: Update UCV +1.25 bet

on:
  push:
    branches: ["main"]
    paths:
      - ".edgelog-triggers/ucv-plus-1-25.json"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          data = json.loads(ledger_path.read_text(encoding="utf-8"))

          timestamp = "2026-07-29T01:33:00Z"
          sync_id = "eval-20260729-santos-ucv-ucv-plus-1-25"
          entry = {
              "syncId": sync_id,
              "updatedAt": timestamp,
              "event": "Santos vs Universidad Central de Venezuela — Second Leg",
              "league": "CONMEBOL Copa Sudamericana",
              "bet": "Universidad Central de Venezuela +1.25",
              "odds": 1.88,
              "stakeVnd": 125000,
              "payoutVnd": 0,
              "status": "open",
              "result": "Pending",
              "eventDate": "2026-07-29",
              "marketType": "Handicap",
              "timing": "live",
              "tags": [
                  "evaluation",
                  "official",
                  "live-read",
                  "model-generated",
                  "knockout-second-leg",
                  "halftime",
                  "handicap",
                  "bk8-remaining-match",
                  "quarter-goal"
              ],
              "notes": "Evaluation bet #25 — BK8 live remaining-match Asian handicap Universidad Central de Venezuela +1.25 placed at halftime with the full-match score 1–1 at odds 1.88 for 0.25u (125,000 VND); sportsbook slip #870116288297586688. The model recommendation was +1.25 at 1.90 with a minimum acceptable price of 1.84, so execution at 1.88 remained above cutoff. Halftime evidence: Santos led 0.83–0.43 in xG, 11–7 in shots, 7–3 in box shots and 20–6 in opposition-box touches, while shots on target and big chances were level at 4–4 and 1–1; Universidad Central led 0.61–0.18 in xGOT. Santos held a large aggregate cushion, reducing the need to force a multi-goal second-half win. Potential payout 235,000 VND and potential full-win profit 110,000 VND. For the remaining-match handicap, Universidad Central winning or drawing the second half is a full win; Santos winning the second half by exactly one goal is a half win; Santos winning it by two or more is a loss."
          }

          bets = data.setdefault("bets", [])
          for index, bet in enumerate(bets):
              if bet.get("syncId") == sync_id:
                  bets[index] = entry
                  break
          else:
              bets.insert(0, entry)

          data["version"] = timestamp
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

      - name: Commit ledger update and clean trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git rm -f .edgelog-triggers/ucv-plus-1-25.json .github/workflows/update-ucv-plus-1-25.yml
          git commit -m "Record UCV +1.25 official bet"
          git push
