name: Settle Central Cordoba Atletico Under 1.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/settle-central-cordoba-atletico-under-1-5.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Settle wager
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          sync_id = 'eval-20260731-central-cordoba-atletico-tucuman-under-1-5'
          now = '2026-07-31T02:12:00Z'
          bet = next((b for b in data.get('bets', []) if b.get('syncId') == sync_id), None)
          if bet is None:
              raise SystemExit(f'Missing bet {sync_id}')

          bet.update({
              'updatedAt': now,
              'status': 'loss',
              'result': 'Loss; match reached at least 2 total goals, with the decisive second goal scored in stoppage time. Exact final score pending confirmation.',
              'settlementType': 'full_loss',
              'payoutVnd': 0,
              'profitVnd': -125000,
              'profitUnits': -0.25,
              'netProfitVnd': -125000,
              'netUnits': -0.25,
              'settledAt': now,
              'finalScore': 'Unconfirmed; at least 2 total goals',
              'finalTotalGoalsMinimum': 2,
              'review': {
                  'resultAssessment': 'Under 1.5 lost in full because the match produced at least two goals. The user confirmed the decisive second goal arrived in stoppage time.',
                  'processAssessment': 'The entry was based on a low-event 0-0 state around 24-25 minutes, but the market required no more than one goal over roughly 65 minutes plus stoppage time. The existing model probability range did not leave enough reserve for late-game and stoppage-time scoring risk. This is a model calibration issue, not a user execution error.',
                  'timingAssessment': 'Execution at 1.88 followed assistant latency while the line, market and score remained synchronized. The loss is not attributed to execution timing; it is attributed to the modeled goal-tail being too narrow.',
                  'nextAdjustment': 'For live league unders with a one-goal full-loss boundary and more than 55 regulation minutes remaining, apply an explicit stoppage-time reserve and require stronger robust edge when any big chance has already occurred. Final calibration update awaits verified final statistics.'
              }
          })
          bet.setdefault('tags', [])
          for tag in ['loss','settled','stoppage-time-goal','late-goal-tail-underestimated','model-calibration-review','user-confirmed-result']:
              if tag not in bet['tags']:
                  bet['tags'].append(tag)
          bet['notes'] = bet.get('notes','') + ' Settlement update: user confirmed the wager lost after the decisive second goal was scored in stoppage time. Return 0 VND; net loss 125,000 VND (-0.25u). Exact final score and full-time statistics remain pending.'
          data['version'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Settle Central Cordoba Atletico Under 1.5 loss' || exit 0
          git push