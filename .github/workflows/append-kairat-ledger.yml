name: Append Kairat ledger entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append-kairat-ledger.yml

permissions:
  contents: write

jobs:
  append-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append confirmed wager
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          slip_id = "870343211460730880"

          if any(str(bet.get("slipId")) == slip_id for bet in data.get("bets", [])):
              print(f"Slip {slip_id} already exists; no change required.")
              raise SystemExit(0)

          timestamp = "2026-07-29T16:38:00Z"
          entry = {
              "syncId": "eval-20260729-kairat-omonia-kairat-team-total-over-1-5",
              "updatedAt": timestamp,
              "event": "Kairat Almaty vs Omonia Nicosia — Second Leg",
              "league": "UEFA Champions League Qualifying",
              "bet": "Kairat Almaty team total Over 1.5",
              "odds": 2.18,
              "stakeVnd": 125000,
              "stakeUnits": 0.25,
              "potentialPayoutVnd": 272500,
              "potentialProfitVnd": 147500,
              "status": "pending",
              "result": "Pending",
              "eventDate": "2026-07-29",
              "marketType": "Team total",
              "timing": "live",
              "bookmaker": "BK8",
              "slipId": slip_id,
              "entryScore": "Kairat Almaty 1-0 Omonia Nicosia",
              "entryAggregateScore": "1-1",
              "entryMinute": "70:50",
              "settlementBasis": "Full-match Kairat team total including the existing 1-0 score; 90 minutes plus regulation stoppage time; extra time excluded",
              "modelRecommendation": {
                  "recommendationType": "official bet",
                  "market": "Kairat Almaty team total Over 1.5",
                  "quotedOdds": 1.98,
                  "minimumAcceptableOdds": 1.97,
                  "stakeUnits": 0.25,
                  "fairOddsRange": [1.69, 1.79],
                  "state": "Approximately 70:09-70:50, Kairat led 1-0 and the aggregate score was 1-1; Omonia were down to ten players; second-half indicators showed 81% possession, 12-1 shots, 3-0 shots on target, 6-0 blocked shots and 4-0 corners for Kairat.",
                  "reasoning": "Kairat retained incentive to find a regulation-time winner, sustained pressure against ten players, and needed only one additional goal for the team total to win. The estimate included a penalty for missing current xG, xGOT, big-chance and box-touch data."
              },
              "execution": {
                  "odds": 2.18,
                  "stakeUnits": 0.25,
                  "stakeVnd": 125000,
                  "potentialPayoutVnd": 272500,
                  "sameMarketAndLine": True,
                  "priceAboveMinimum": True,
                  "withinStakeCap": True,
                  "deviations": []
              },
              "tags": [
                  "evaluation",
                  "official",
                  "official-after-user-confirmation",
                  "live-read",
                  "football",
                  "team-total",
                  "lineup-confirmed",
                  "competition-context",
                  "aggregate-state",
                  "red-card",
                  "stoppage-time-risk",
                  "model-generated",
                  "user-executed",
                  "price-above-model-cutoff",
                  "within-stake-cap"
              ],
              "notes": "Official live football bet confirmed by the user. Kairat Almaty team total Over 1.5 at 2.18 for 0.25u (125,000 VND), sportsbook slip #870343211460730880. Entry was approximately 70:50 with Kairat leading 1-0, aggregate 1-1, and Omonia reduced to ten players. One additional Kairat goal wins. Potential payout is 272,500 VND and potential profit is 147,500 VND (+0.295u). Execution exceeded the model minimum acceptable odds of 1.97 and respected the active 0.25u football stake cap. Main evidence: Kairat's second-half 81% possession, 12-1 shots, 3-0 shots on target, 6-0 blocked shots and 4-0 corners. Main risks: Omonia's compact ten-man low block, limited on-target conversion, missing current xG/xGOT/big-chance/box-touch data, and extra time remaining an acceptable fallback if regulation ended 1-0.",
              "placedAt": "2026-07-29T23:33:00+07:00",
              "addedAt": timestamp,
              "createdAt": timestamp
          }

          data.setdefault("bets", []).insert(0, entry)
          data["version"] = timestamp
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit ledger update
        shell: bash
        run: |
          if git diff --quiet -- ledger.json; then
            echo "No ledger change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "Record Kairat team total Over 1.5 bet"
          git push
