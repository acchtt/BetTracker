name: Record DK Challengers series moneyline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/record-dkc-vs-t1a-series-ml.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record confirmed LoL bet
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sync_id = "eval-20260730-dkc-t1a-series-dkc-ml"
          if not any(item.get("syncId") == sync_id for item in data.get("bets", [])):
              timestamp = "2026-07-30T04:56:27Z"
              entry = {
                  "syncId": sync_id,
                  "updatedAt": timestamp,
                  "event": "Dplus KIA Challengers vs T1 Esports Academy — Series",
                  "league": "LCK CL 2026 Rounds 3-4",
                  "competitionStage": "Challenge Group, Round 3 Match 97",
                  "format": "Best-of-three series",
                  "bet": "Dplus KIA Challengers series moneyline",
                  "settlementBasis": "Dplus KIA Challengers must win the best-of-three series.",
                  "odds": 2.88,
                  "stakeVnd": 125000,
                  "stakeUnits": 0.25,
                  "potentialPayoutVnd": 360000,
                  "potentialProfitVnd": 235000,
                  "status": "open",
                  "result": "Pending",
                  "eventDate": "2026-07-30",
                  "marketType": "Moneyline",
                  "timing": "prematch",
                  "slipId": "CGTDA112909552E5627QHHD993",
                  "patch": "26.14",
                  "rosterStatus": "confirmed",
                  "roster": {
                      "DKC": ["Jaehyuk", "Solid", "Garden", "Wayne", "Loopy"],
                      "T1A": ["Haetae", "Painter", "Guti", "Cypher", "Cloud"]
                  },
                  "sideStatus": "Game 1 side unconfirmed; series market",
                  "draftStatus": "Pre-draft series market",
                  "modelRecommendation": {
                      "recommendationType": "official bet",
                      "market": "Dplus KIA Challengers series moneyline",
                      "quotedOdds": 2.595,
                      "minimumAcceptableOdds": 2.50,
                      "stakeUnits": 0.25,
                      "fairOddsRange": [2.30, 2.45],
                      "estimatedProbabilityRange": [0.41, 0.435],
                      "reasoning": "The market price understated DK Challengers' upset probability after confirmed lineups. T1A held the stronger season baseline, but DK retained a competitive series profile and the series edge was not dependent on one specific Game 1 side or draft."
                  },
                  "execution": {
                      "odds": 2.88,
                      "stakeUnits": 0.25,
                      "stakeVnd": 125000,
                      "potentialPayoutVnd": 360000,
                      "sameMarketAndLine": True,
                      "priceAboveMinimum": True,
                      "priceBetterThanQuoted": True,
                      "withinStakeCap": True,
                      "deviations": []
                  },
                  "competitionContext": "Challenge Group match with meaningful playoff and seeding implications.",
                  "mainRisks": [
                      "T1A has the stronger season-long consistency baseline",
                      "T1A has more established jungle-mid continuity",
                      "Academy series carry elevated substitution and draft-adaptation variance"
                  ],
                  "tags": [
                      "evaluation", "official", "official-after-user-confirmation", "lol",
                      "lck-cl", "prematch", "series-moneyline", "roster-confirmed",
                      "patch-confirmed", "academy-volatility", "model-generated",
                      "user-executed", "price-above-minimum", "price-better-than-quoted",
                      "within-stake-cap", "pending-result"
                  ],
                  "notes": "User confirmed placement by sportsbook slip at 11:56:27 ICT. Exact wager: Dplus KIA Challengers to win the series against T1 Esports Academy at 2.88 for 0.25u (125,000 VND), slip #CGTDA112909552E5627QHHD993. Potential payout 360,000 VND and potential profit 235,000 VND (+0.47u). Execution improved materially from the model-quoted 2.595 and remained above the 2.50 minimum acceptable odds. Starting lineups and patch 26.14 were confirmed; Game 1 side and draft were not required for this series-moneyline execution.",
                  "placedAt": "2026-07-30T11:56:27+07:00",
                  "userConfirmedAt": "2026-07-30T11:56:27+07:00",
                  "addedAt": timestamp,
                  "createdAt": timestamp
              }
              data["version"] = timestamp
              data.setdefault("bets", []).insert(0, entry)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit ledger update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/record-dkc-vs-t1a-series-ml.yml
          git add ledger.json
          git commit -m "Record DK Challengers series moneyline bet" || exit 0
          git push