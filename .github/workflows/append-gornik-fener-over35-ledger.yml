name: Append Gornik Fenerbahce ledger entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append-gornik-fener-over35-ledger.yml

permissions:
  contents: write

jobs:
  append-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update authoritative ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sync_id = "eval-20260729-gornik-fenerbahce-over-3-5"
          now = "2026-07-29T19:11:00Z"

          existing = next((bet for bet in data.get("bets", []) if bet.get("syncId") == sync_id), None)
          if existing is not None:
              raise SystemExit(f"Ledger entry already exists: {sync_id}")

          entry = {
              "syncId": sync_id,
              "updatedAt": now,
              "event": "Gornik Zabrze vs Fenerbahce — Second Leg",
              "league": "UEFA Champions League Qualifying",
              "competitionStage": "Second qualifying round, second leg",
              "venue": "Stadion im. Ernesta Pohla, Zabrze",
              "format": "Two-legged knockout tie; extra time and penalties if aggregate level after regulation",
              "bet": "Over 3.5 total goals",
              "odds": 2.03,
              "stakeVnd": 125000,
              "stakeUnits": 0.25,
              "potentialPayoutVnd": 253750,
              "potentialProfitVnd": 128750,
              "status": "pending",
              "result": "Pending",
              "eventDate": "2026-07-29",
              "sportsbookEventDate": "2026/07/29 10:00",
              "sportsbookPlacedAt": "2026/07/29 11:10",
              "marketType": "Totals",
              "timing": "live",
              "bookmaker": "BK8",
              "slipId": "870382851144253441",
              "settlementSlipId": "870382851144253440",
              "entryScore": "Gornik Zabrze 1-1 Fenerbahce",
              "entryAggregateScore": "Fenerbahce 2-1 Gornik Zabrze",
              "entryMinute": "45:40",
              "settlementBasis": "Full-match total including the existing 1-1 score; 90 minutes plus regulation stoppage time; extra time excluded. Four or more total goals wins; three or fewer loses.",
              "modelRecommendation": {
                  "recommendationType": "official bet",
                  "market": "Over 3.5 total goals",
                  "quotedOdds": 1.99,
                  "minimumAcceptableOdds": 1.90,
                  "stakeUnits": 0.25,
                  "state": "Halftime/45:40, score 1-1 and Fenerbahce led 2-1 on aggregate. Halftime indicators: xG 0.49-1.71, xGOT 0.71-0.73, big chances 1-3, shots on target 4-1, box shots 4-3, opposition-box touches 17-9, corners 5-3 and total shots 9-6.",
                  "reasoning": "Gornik needed another goal to level the aggregate and force extra time, sustaining a forced-chase branch, while Fenerbahce retained strong transition scoring routes. Combined 2.20 xG and four big chances supported genuine chance quality, and two additional regulation-time goals were required for the bet to win."
              },
              "execution": {
                  "odds": 2.03,
                  "stakeUnits": 0.25,
                  "stakeVnd": 125000,
                  "potentialPayoutVnd": 253750,
                  "sameMarketAndLine": True,
                  "priceAboveMinimum": True,
                  "withinStakeCap": True,
                  "deviations": []
              },
              "tags": [
                  "evaluation",
                  "official",
                  "official-after-user-confirmation",
                  "live-read",
                  "football",
                  "totals",
                  "lineup-confirmed",
                  "competition-context",
                  "aggregate-state",
                  "forced-chase",
                  "late-game-module",
                  "stoppage-time-risk",
                  "model-generated",
                  "user-executed",
                  "price-above-model-cutoff",
                  "within-stake-cap"
              ],
              "notes": "Official live football bet confirmed by the user. Gornik Zabrze vs Fenerbahce full-match Over 3.5 at 2.03 for 0.25u (125,000 VND), betting slip #870382851144253441 and settlement slip #870382851144253440. Entry was 45:40 with the score 1-1 and Fenerbahce leading 2-1 on aggregate. The existing two goals count; two or more additional regulation-time goals are required to win. Potential payout is 253,750 VND and potential profit is 128,750 VND (+0.2575u). Execution exceeded the model minimum acceptable odds of 1.90 and respected the active 0.25u football stake cap. Main evidence: combined 2.20 xG, four big chances, Gornik's aggregate chase and Fenerbahce's transition threat. Main risks: Fenerbahce could manage the qualifying position, Gornik's shot quality was mixed, and a single additional goal would still leave the wager short.",
              "placedAt": "2026-07-29T11:10:00",
              "userConfirmedAt": "2026-07-30T02:11:00+07:00",
              "addedAt": now,
              "createdAt": now
          }

          data.setdefault("bets", []).insert(0, entry)
          data["version"] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit ledger entry
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add ledger.json
          git commit -m "Record Gornik Fenerbahce Over 3.5 bet"
          git push
