name: Settle Olimpia Under 2.75

on:
  push:
    branches: ["main"]
    paths:
      - "olimpia-result-trigger.json"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Settle bet and add review
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          data = json.loads(ledger_path.read_text(encoding="utf-8"))

          timestamp = "2026-07-29T03:05:00Z"
          sync_id = "eval-20260729-olimpia-mixco-under-2-75"

          for entry in data.get("bets", []):
              if entry.get("syncId") != sync_id:
                  continue

              entry["updatedAt"] = timestamp
              entry["payoutVnd"] = 472500
              entry["status"] = "win"
              entry["result"] = "Win confirmed by user; final score not provided"
              entry["settledAt"] = timestamp

              tags = entry.setdefault("tags", [])
              for tag in [
                  "user-confirmed-result",
                  "model-review",
                  "price-below-cutoff",
                  "stake-above-model-cap",
                  "competition-context-retrospective"
              ]:
                  if tag not in tags:
                      tags.append(tag)

              review = (
                  " User confirmed the wager won in full; final score was not provided. "
                  "Payout 472,500 VND and net profit 222,500 VND (+0.445u). "
                  "Process review: the match read had genuine support because combined xG was only 0.59 at entry, Mixco had 0.07 xG and three opposition-box touches, and Under 2.75 retained half-loss protection at exactly three goals. "
                  "However, execution at 1.89 was below the stated 1.90 cutoff, and the 0.5u placed stake exceeded both the 0.25u recommendation and the active v0.2.3 football stake cap. "
                  "The CONCACAF Central American Cup group-stage context was not translated into an explicit uncertainty adjustment; under v0.2.5 it must now be shown numerically as competition context. "
                  "The winning result does not validate the below-cutoff price or oversized stake. No new rule is promoted from this single result; retain the 0.25u cap, price discipline and mandatory competition-context module."
              )
              entry["notes"] = entry.get("notes", "").rstrip() + review
              break
          else:
              raise RuntimeError(f"Entry not found: {sync_id}")

          data["version"] = timestamp
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

      - name: Commit settlement and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git rm -f olimpia-result-trigger.json .github/workflows/update-olimpia-result.yml
          git commit -m "Settle Olimpia Under 2.75 as win and add review"
          git push
