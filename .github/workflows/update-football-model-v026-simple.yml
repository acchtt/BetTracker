name: Update football model v0.2.6 simple

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-football-model-v026-simple.yml

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write v0.2.6 rules and append active overrides
        shell: python
        run: |
          from pathlib import Path

          rules = '''# Football Model Rules v0.2.6

**Effective date:** 2026-07-30  
**Status:** Active evaluation rule  
**Supersedes:** `MODEL_RULES_FOOTBALL_V0.2.5.md` where knockout chase intensity, next-goal state transitions, correlated live evidence, or halftime multi-goal totals conflict.

## Trigger

The Gornik Zabrze vs Fenerbahce Over 3.5 assessment at 1-1 and 45:40 exposed a process defect independent of final settlement. Gornik needed one goal to level the aggregate and force extra time, while the wager required two more regulation-time goals. The model priced the next-goal incentive too strongly and did not adequately price the lower-urgency state after a possible aggregate equalizer. It also treated overlapping xG, xGOT, big-chance, shot, box-shot, and box-touch indicators as more independent than they were.

## Active rules

### Goals-required tier

Before applying any knockout chase uplift, classify the trailing team as:

- `single-goal-to-level`: one goal levels the aggregate or forces extra time;
- `single-goal-to-qualify`: one goal moves the team ahead or qualifies it;
- `multi-goal-chase`: at least two goals remain necessary;
- `no-chase`: the current state creates no rational need for increased attacking risk.

The strong late multi-goal-tail uplift applies only to a behaviorally confirmed `multi-goal-chase`. A team needing one goal to force extra time does not automatically create a strong two-goal remaining tail.

### Mandatory next-goal state tree

For any live total or team total requiring two or more additional goals, price three branches:

1. trailing team scores next;
2. leading team scores next;
3. no goal through the next material checkpoint.

After each branch, recalculate aggregate score, goals still needed, extra-time availability, attacking urgency, transition exposure, and the probability of the subsequent goal required by the wager.

### Aggregate-reset branch

When a trailing-team goal levels the aggregate and extra time becomes available, apply `aggregate-reset`:

- reduce immediate combined scoring intensity for the next 5-10 minutes unless observed behavior supports continued regulation aggression;
- do not assume both teams will continue chasing a regulation winner;
- widen the probability interval;
- price the second required goal separately when the market still needs another goal.

### Correlated evidence

Treat xG, xGOT, big chances, shots on target, box shots, and box touches as partially correlated.

- Group overlapping indicators from the same passage into a `chance cluster`.
- High xG with materially lower xGOT requires regression unless the missed chances are clearly repeatable.
- Low-xG shots on target do not carry the same forward scoring value as high-quality shots on target.
- A static halftime screenshot receives a persistence penalty unless the previous 10-15 minutes or multiple snapshots confirm continuing chance creation.

### Halftime multi-goal total gate

For halftime or early-second-half totals requiring at least two additional goals:

- require an independently supported pathway to the second goal, not only a strong next-goal case;
- when the trailing team is `single-goal-to-level` and the first goal could trigger an aggregate reset, require the normal five-point edge plus an additional two-point buffer;
- under the active restriction, this normally means at least seven percentage points over breakeven for `OFFICIAL BET` status;
- cap at `LEAN` when the thesis supports only one goal to force extra time;
- prefer whole-goal protection when reasonably priced.

### Branch weighting

Do not make the forced-chase branch dominant solely because the fixture is a knockout tie. Increase it only when supported by at least two of: multiple goals still needed, attacking substitutions, advanced fullbacks, reduced defensive numbers, repeated transition chances, persistent high-quality chances, or defensive fatigue/cards.

### Required output

Applicable knockout recommendations must show:

- `Goals-required tier`
- `Next-goal state tree`
- `Aggregate-reset risk`
- `Chance-quality and correlation check`
- `Late-game and stoppage-time branch`
- `Market implication`

Use tags `single-goal-to-level`, `multi-goal-chase`, `aggregate-reset`, and `chance-cluster-adjusted` when applicable.

## Review threshold

Review after the next 10 settled official football totals assessed under v0.2.6, including at least five knockout totals if available. Separate single-goal-to-level from multi-goal-chase states, one-goal from two-or-more-goal requirements, aggregate-reset occurrence, closing-line quality, calibration, ROI, and process accuracy.
'''
          Path('MODEL_RULES_FOOTBALL_V0.2.6.md').write_text(rules, encoding='utf-8')

          changelog_path = Path('MODEL_CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog = changelog.replace('`MODEL_RULES_FOOTBALL_V0.2.5.md`', '`MODEL_RULES_FOOTBALL_V0.2.6.md`', 1)
          entry = '''\n\n---\n\n## v0.2.6 — 2026-07-30\n\n### Football knockout chase calibration, next-goal reset, and correlated-evidence control\n\n**Status:** Active evaluation rule  \n**Detailed implementation:** `MODEL_RULES_FOOTBALL_V0.2.6.md` and `FOOTBALL_BETTING_PROCEDURE.md`\n\n**Triggering evidence**\n\n- Gornik Zabrze vs Fenerbahce Over 3.5 at 1-1 and 45:40 required two more goals while Gornik needed only one goal to level the aggregate and force extra time.\n- The process review identified a state-transition error independent of settlement: the next-goal incentive was priced without adequately pricing the possible aggregate reset afterward.\n- Overlapping xG, xGOT, big-chance, shot, box-shot, and box-touch evidence was treated as too independent.\n\n**Previous rule**\n\nThe model separated controlled and forced-chase branches but did not formally distinguish one-goal-to-level from multi-goal chase states, require a next-goal tree, or apply a correlated-evidence discount.\n\n**New rule**\n\n- Classify knockout states as `single-goal-to-level`, `single-goal-to-qualify`, `multi-goal-chase`, or `no-chase`.\n- Reserve the strong multi-goal-tail uplift for behaviorally confirmed multi-goal chase states.\n- For totals requiring two or more additional goals, build a next-goal state tree.\n- Apply an `aggregate-reset` branch when a goal levels the tie and makes extra time available.\n- Treat xG, xGOT, big chances, shots on target, box shots, and box touches as correlated chance-cluster evidence.\n- Static halftime snapshots receive a persistence penalty.\n- Halftime multi-goal totals in a single-goal-to-level state require an additional two-point edge buffer, normally seven points over breakeven.\n- Cap at `LEAN` when only the next goal is independently supported.\n\n**Expected benefit**\n\nImprove knockout-total calibration, reduce double-counting, and avoid overstating two-goal tails when only one goal is strongly incentivized.\n\n**Possible downside**\n\nThe added branching may slow live analysis and produce more passed opportunities.\n\n**Review threshold**\n\nReview after the next 10 settled official football totals under v0.2.6, including at least five knockout totals if available.\n'''
          if '## v0.2.6 — 2026-07-30' not in changelog:
              changelog += entry
          changelog_path.write_text(changelog, encoding='utf-8')

          procedure_path = Path('FOOTBALL_BETTING_PROCEDURE.md')
          procedure = procedure_path.read_text(encoding='utf-8')
          procedure = procedure.replace('**Effective date:** 2026-07-29', '**Effective date:** 2026-07-30', 1)
          procedure = procedure.replace('`MODEL_RULES_FOOTBALL_V0.2.5.md`', '`MODEL_RULES_FOOTBALL_V0.2.6.md`', 1)
          override = '''\n\n---\n\n## 17. Active v0.2.6 knockout-total override\n\nThis section takes precedence over earlier aggregate-state interpretations.\n\n- Classify the goals-required tier before applying a chase uplift.\n- For totals requiring two or more additional goals, build a next-goal state tree.\n- Apply aggregate-reset risk when a goal would level the tie and make extra time available.\n- Treat xG, xGOT, big chances, shots on target, box shots, and box touches as correlated chance clusters.\n- Apply a persistence penalty to static halftime snapshots.\n- A halftime or early-second-half total needing two or more goals in a `single-goal-to-level` state requires at least a seven-point uncertainty-adjusted edge for `OFFICIAL BET` status.\n- If only the next goal is strongly supported, return `LEAN` or `NO BET`.\n- Required output: `Goals-required tier`, `Next-goal state tree`, `Aggregate-reset risk`, `Chance-quality and correlation check`, `Late-game and stoppage-time branch`, and `Market implication`.\n'''
          if '## 17. Active v0.2.6 knockout-total override' not in procedure:
              procedure += override
          procedure_path.write_text(procedure, encoding='utf-8')
      - name: Commit model update
        run: |
          git config user.name "SlipTrace Model Bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add MODEL_RULES_FOOTBALL_V0.2.6.md MODEL_CHANGELOG.md FOOTBALL_BETTING_PROCEDURE.md
          git commit -m "Update football model to v0.2.6"
          git push
