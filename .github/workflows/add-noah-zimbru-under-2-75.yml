name: Add Noah Zimbru Under 2.75

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-noah-zimbru-under-2-75.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add confirmed football wager
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          sync_id = 'eval-20260730-noah-zimbru-under-2-75'
          if not any(b.get('syncId') == sync_id for b in data.get('bets', [])):
              record = {
                'syncId': sync_id,
                'updatedAt': '2026-07-30T16:37:00Z',
                'event': 'FC Noah vs Zimbru Chisinau — Second Leg',
                'league': 'UEFA Conference League Qualifying',
                'competitionStage': 'Second qualifying round, second leg',
                'format': 'Two-legged knockout tie; full-match total settles after 90 minutes plus regulation stoppage time; extra time and penalties excluded',
                'bet': 'Under 2.75 total goals',
                'odds': 2.03,
                'stakeVnd': 125000,
                'stakeUnits': 0.25,
                'potentialPayoutVnd': 253750,
                'potentialProfitVnd': 128750,
                'status': 'pending',
                'result': 'Pending',
                'eventDate': '2026-07-30',
                'marketType': 'Totals',
                'timing': 'live-first-half',
                'bookmaker': 'BK8',
                'slipId': '870706720962912256',
                'entryScore': 'FC Noah 1-0 Zimbru Chisinau',
                'entryAggregateScore': 'FC Noah led 2-1 on aggregate',
                'entryMinute': 'First half shortly after the 34:23 model snapshot; exact execution minute unconfirmed',
                'settlementBasis': 'Full-match Asian total Under 2.75 including the existing 1-0 score; 90 minutes plus regulation stoppage time; extra time excluded. Final total 0-2 goals is a full win; exactly 3 goals is a half loss with 62,500 VND returned; 4 or more goals is a full loss.',
                'modelRecommendation': {
                  'recommendationType': 'official bet at prior synchronized state',
                  'modelVersion': 'football-v0.2.7',
                  'market': 'Under 2.75 total goals',
                  'quotedOdds': 2.11,
                  'minimumAcceptableOdds': 2.00,
                  'stakeUnits': 0.25,
                  'state': '0-0 at 34:23 of the first half; Noah led shots 6-1, shots on target 2-0, corners 2-0 and possession 64%-36%.',
                  'reasoning': 'The protected Under 2.75 line was preferred to Under 2.5 because three total goals produced only a half loss. Noah were territorially dominant but the match had only seven shots, two on target and little Zimbru threat at the synchronized state.'
                },
                'execution': {
                  'odds': 2.03,
                  'stakeUnits': 0.25,
                  'stakeVnd': 125000,
                  'potentialPayoutVnd': 253750,
                  'sameMarketAndLine': True,
                  'priceAboveOriginalMinimum': True,
                  'withinStakeCap': True,
                  'stateSynchronized': False,
                  'priceMoveClassification': 'price remained above prior cutoff, but score changed before execution',
                  'deviations': [
                    'entry score changed from 0-0 to 1-0 before placement',
                    'exact execution minute was not supplied',
                    'no fresh model reassessment after the goal'
                  ]
                },
                'tags': [
                  'evaluation', 'official-after-user-confirmation', 'football', 'uefa-conference-league',
                  'knockout-second-leg', 'live-read', 'totals', 'asian-total', 'under-2-75',
                  'lineup-confirmed', 'competition-context', 'aggregate-state', 'single-goal-to-level',
                  'stoppage-time-risk', 'user-executed', 'within-stake-cap', 'state-change-before-execution',
                  'unsynchronized-execution', 'model-recommendation-expired'
                ],
                'notes': 'User confirmed sportsbook acceptance of FC Noah vs Zimbru Chisinau full-match Under 2.75 at 2.03 for 0.25u (125,000 VND), slip #870706720962912256. Potential full-win payout is 253,750 VND and potential profit is 128,750 VND (+0.2575u). The slip displayed [1:0], whereas the model recommendation was issued at 0-0 at 34:23. The score change is material: Noah moved ahead 2-1 on aggregate and Zimbru became single-goal-to-level. Although the accepted price remained above the prior 2.00 cutoff and the stake respected the cap, the original recommendation expired when the goal was scored. The wager is official/open after user confirmation but is separated from fully synchronized model-approved performance until a fresh state review can validate the execution.',
                'placedAt': '2026-07-30T23:37:00+07:00',
                'userConfirmedAt': '2026-07-30T23:37:00+07:00',
                'addedAt': '2026-07-30T16:37:00Z',
                'createdAt': '2026-07-30T16:37:00Z'
              }
              data.setdefault('bets', []).insert(0, record)
              data['version'] = '2026-07-30T16:37:00Z'
              meta = data.setdefault('mergeMetadata', {})
              meta['officialRecordsAdded'] = int(meta.get('officialRecordsAdded', 0)) + 1
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Record Noah Zimbru Under 2.75 wager' || exit 0
          git push
