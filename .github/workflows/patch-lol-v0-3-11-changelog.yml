name: Patch LoL v0.3.11 changelog

on:
  push:
    paths:
      - 'pending/2026-08-01-lol-v0-3-11-changelog-sync.json'

permissions:
  contents: write

jobs:
  patch-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch model changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MODEL_CHANGELOG.md')
          text = path.read_text(encoding='utf-8')

          old_docs = '- League of Legends recommendations must follow `LOL_BETTING_PROCEDURE_ADDENDUM_2026-08-01.md`, `LOL_BETTING_PROCEDURE.md`, `MODEL_RULES_LOL_V0.3.10.md`, `MODEL_RULES_LOL_V0.3.9.md`, `MODEL_RULES_LOL_V0.3.8.md`, `MODEL_RULES_LOL_V0.3.7.md`, `MODEL_RULES_LOL_V0.3.6.md`, `STAKE_POLICY_V2.json`, this changelog, and the current review restrictions. Older LoL rules remain active where not superseded.'
          new_docs = '- League of Legends recommendations must follow `LOL_BETTING_PROCEDURE_ADDENDUM_2026-08-01.md`, `LOL_BETTING_PROCEDURE.md`, `MODEL_RULES_LOL_V0.3.11.md`, `MODEL_RULES_LOL_V0.3.10.md`, `MODEL_RULES_LOL_V0.3.9.md`, `MODEL_RULES_LOL_V0.3.8.md`, `MODEL_RULES_LOL_V0.3.7.md`, `MODEL_RULES_LOL_V0.3.6.md`, `STAKE_POLICY_V2.json`, this changelog, and the current review restrictions. Older LoL rules remain active where not superseded.'
          if old_docs in text:
              text = text.replace(old_docs, new_docs, 1)

          evidence_anchor = '- The evidence for v0.3.10 is recorded in the authoritative `ledger.json` entry `eval-20260801-al-tt-g1-over-32-minutes`.'
          evidence_line = '- The evidence for v0.3.11 is recorded in the authoritative `ledger.json` entry `eval-20260801-al-tt-g2-under-29-5-kills` and `MODEL_RULES_LOL_V0.3.11.md`.'
          if evidence_line not in text and evidence_anchor in text:
              text = text.replace(evidence_anchor, evidence_anchor + '\n' + evidence_line, 1)

          section = '''## v0.3.11 — 2026-08-01

### LoL immediate price-only execution tolerance and outcome-neutral probation attribution

**Status:** Active immediately  
**Detailed implementation:** `MODEL_RULES_LOL_V0.3.11.md`  
**Authoritative evidence:** `ledger.json` entry `eval-20260801-al-tt-g2-under-29-5-kills`

### Sport and markets affected

League of Legends execution validity, recommendation expiry, probation attribution, and price-slippage reporting across all markets.

### Triggering evidence

Anyone's Legend vs ThunderTalk Gaming Game 2:

- the model issued `OFFICIAL BET` on Under 29.5 kills at 1.871 from a synchronized 10:24 state;
- the recommendation stated a 1.82 target floor;
- the exact line shortened immediately to 1.795 with no reported meaningful state event;
- the decimal-odds move was 0.076 and the implied-probability move was approximately 2.26 percentage points, below both existing material expiry thresholds;
- accepted odds remained above the project-wide 1.60 minimum and the stake respected the 0.25u map cap;
- AL won 20-8 in kills at 24:04, producing 28 total kills and a 198,750 VND profit (+0.19875u).

### Previous rule

v0.3.9 made an odds move of at least 0.10, an implied-probability move of at least three points, or any material state change a hard expiry trigger. The operating language still treated a recommendation-specific minimum price as a separate absolute execution gate. This created an inconsistency when an immediate same-state price move stayed below both material thresholds but crossed the recommendation-specific target floor.

### New rule

- Continue the ten-wager probation without reset. AL vs TT Game 2 is qualifying wager 2 of 10; the current qualifying record is 1-1 for -51,250 VND (-0.05125u).
- Future actionable recommendations must distinguish quoted odds, model target floor, and hard execution floor.
- Unless explicitly set higher, the hard execution floor is the project-wide 1.60 minimum.
- An immediate price-only move may remain model-approved when the exact event, map, market, selection, and line are unchanged; no meaningful state event occurred; accepted odds remain above the hard floor; the odds move is below 0.10; the implied-probability move is below three points; the stake and map cap are compliant; and the original recommendation was `OFFICIAL BET`.
- A fill below the model target floor is adverse slippage and must be recorded, but it does not automatically exclude the wager when the complete tolerance gate passes.
- Material favorable and adverse moves still expire and require reassessment.
- The rule is outcome-neutral: qualifying price-slipped wins and losses must be counted symmetrically.
- Missing timing or state information prevents use of the tolerance rule.

### Expected benefit

Reflect realistic live-market movement between verdict and acceptance, preserve symmetric model attribution, and retain exact slippage data without treating every narrow target-floor miss as a stale execution.

### Possible downside

Model-approved performance may include thinner-value fills, repeated adverse slippage can erode profitability, and user-reported immediate timing may be imperfect. The unchanged material thresholds, exact-line requirement, global floor, state gate, and full slippage logging limit those risks.

### Review threshold

Review after the earlier of five settled LoL wagers using the immediate price-only tolerance or completion of the overall ten-wager probation. Report target-floor misses separately by direction, quoted and accepted price, implied-probability movement, result, market, league, VND, units, and closing-line quality.

---

'''
          anchor = '## v0.3.10 — 2026-08-01'
          if '## v0.3.11 — 2026-08-01' not in text:
              text = text.replace(anchor, section + anchor, 1)

          text = text.replace('**Status:** Active immediately  \n**Detailed implementation:** `MODEL_RULES_LOL_V0.3.10.md`', '**Status:** Active where not superseded by v0.3.11  \n**Detailed implementation:** `MODEL_RULES_LOL_V0.3.10.md`', 1)
          text = text.replace('**Status:** Active where not superseded by v0.3.10  \n**Detailed implementation:** `MODEL_RULES_LOL_V0.3.9.md`', '**Status:** Active where not superseded by v0.3.10 or v0.3.11  \n**Detailed implementation:** `MODEL_RULES_LOL_V0.3.9.md`', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MODEL_CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Document LoL v0.3.11 price-only execution tolerance'
          git push
