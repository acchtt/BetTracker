name: Update UCV result

on:
  push:
    branches: ["main"]
    paths:
      - "ucv-result-trigger.json"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          data = json.loads(ledger_path.read_text(encoding="utf-8"))

          timestamp = "2026-07-29T02:00:00Z"
          sync_id = "eval-20260729-santos-ucv-ucv-plus-1-25"

          for entry in data.get("bets", []):
              if entry.get("syncId") != sync_id:
                  continue

              entry["updatedAt"] = timestamp
              entry["payoutVnd"] = 0
              entry["status"] = "loss"
              entry["result"] = "Santos 4–2 Universidad Central de Venezuela (Loss; handicap-breaking goal in stoppage time, user-confirmed)"
              entry["settledAt"] = timestamp

              tags = entry.setdefault("tags", [])
              for tag in ["user-confirmed-result", "stoppage-time-loss", "model-review"]:
                  if tag not in tags:
                      tags.append(tag)

              entry["notes"] = entry.get("notes", "").rstrip() + " User confirmed the final score was Santos 4–2 and clarified that the decisive late event occurred in stoppage time, not extra time. From the 1–1 halftime entry point, Santos won the second half 3–1, a two-goal remaining-match margin, so Universidad Central +1.25 lost in full. Payout 0 VND; net loss 125,000 VND (-0.25u). Review: the model over-relied on Santos' aggregate cushion and underweighted the open late-game tail created by Universidad Central's need to chase, Santos' counterattacking quality, substitutions and stoppage time. Updated rule: in knockout second legs, do not treat an aggregate cushion alone as suppressing favorite scoring; explicitly increase multi-goal late-tail risk for live underdog handicaps when the trailing side must attack. This was a regulation-time stoppage-time loss, not an extra-time settlement issue."
              break
          else:
              raise RuntimeError(f"Entry not found: {sync_id}")

          data["version"] = timestamp
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

      - name: Commit update and clean trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git rm -f ucv-result-trigger.json .github/workflows/update-ucv-result.yml
          git commit -m "Settle UCV +1.25 as stoppage-time loss"
          git push
