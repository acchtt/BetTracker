name: Add Valerenga HamKam Under 3 bet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-valerenga-hamkam-under3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add confirmed wager to ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          slip_id = '871076012434309120'

          if not any(str(b.get('slipId', '')) == slip_id for b in data.get('bets', [])):
              record = {
                  'syncId': 'football-20260801-valerenga-hamkam-under-3-210',
                  'updatedAt': '2026-07-31T17:05:00Z',
                  'event': 'Valerenga vs HamKam',
                  'league': 'Norway Eliteserien 2026',
                  'competitionStage': 'Round 16',
                  'format': 'Single league match; 90 minutes plus regulation stoppage time',
                  'bet': 'Under 3 total goals',
                  'settlementBasis': 'Full win with 0-2 total goals; push with exactly 3; full loss with 4 or more. Regulation time plus stoppage time only.',
                  'odds': 2.10,
                  'stakeVnd': 250000,
                  'stakeUnits': 0.5,
                  'potentialPayoutVnd': 525000,
                  'potentialProfitVnd': 275000,
                  'payoutVnd': None,
                  'netProfitVnd': None,
                  'netUnits': None,
                  'status': 'open',
                  'result': 'pending',
                  'eventDate': '2026-08-01',
                  'marketType': 'Total goals',
                  'timing': 'live',
                  'slipId': slip_id,
                  'bookmaker': 'BK8',
                  'entryScore': '0-0',
                  'entryMinute': 'not supplied; early live entry',
                  'lineupStatus': 'confirmed from user-provided lineup screen',
                  'modelRecommendation': {
                      'recommendationType': 'lean-small',
                      'modelVersion': 'football-v0.2.12',
                      'market': 'Under 3 total goals',
                      'quotedOdds': 2.06,
                      'minimumAcceptableOdds': 2.03,
                      'stakeUnits': 0.125,
                      'reasoning': 'Whole-goal protection was preferred because exactly three goals remained a material branch. HamKam used a downgraded attacking lineup, while Valerenga defensive uncertainty prevented official-bet status.'
                  },
                  'execution': {
                      'odds': 2.10,
                      'stakeUnits': 0.5,
                      'stakeVnd': 250000,
                      'sameMarketAndLine': True,
                      'withinModelStakeRecommendation': False,
                      'withinFootballStakeCap': False,
                      'priceAboveMinimum': True,
                      'priceBetterThanQuoted': True,
                      'stateSynchronized': False,
                      'attributionTier': 'user-executed deviation',
                      'deviations': [
                          'Placed 0.5u versus the model LEAN — SMALL recommendation of 0.125u',
                          'Placed above the active 0.25u football exposure cap',
                          'Executed live at 0-0 after a prematch recommendation without a fresh synchronized live-state reassessment'
                      ]
                  },
                  'review': {
                      'resultGrade': 'pending',
                      'processGrade': 'pending',
                      'reviewAfterSettlement': True
                  },
                  'tags': [
                      'football',
                      'norway',
                      'eliteserien',
                      'live',
                      'total-goals',
                      'under-3',
                      'whole-goal-protection',
                      'lean-small',
                      'official-after-user-confirmation',
                      'lineup-confirmed',
                      'model-v0-2-12',
                      'user-executed-deviation',
                      'stake-above-model-recommendation',
                      'stake-above-football-cap',
                      'unsynchronized-execution',
                      'open'
                  ],
                  'notes': 'User confirmed accepted slip #871076012434309120: live Under 3 at 2.10, entry score 0-0. Bookmaker display 250.00/525.00 recorded as 250,000/525,000 VND under the project ledger convention. The wager is official/open after user confirmation, but remains classified as a placed LEAN — SMALL with oversized and unsynchronized execution deviations.'
              }
              data.setdefault('bets', []).insert(0, record)
              data['version'] = '2026-07-31T17:05:00Z'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Record Valerenga HamKam Under 3 placement' || exit 0
          git push

# trigger
