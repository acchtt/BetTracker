name: Settle Hearts Sturm bet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ledger
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          sync_id = 'eval-20260729-hearts-sturm-graz-sturm-dnb'
          timestamp = '2026-07-29T00:55:00Z'
          bet = next(item for item in data['bets'] if item.get('syncId') == sync_id)
          data['version'] = timestamp
          bet['updatedAt'] = timestamp
          bet['payoutVnd'] = 257500
          bet['status'] = 'win'
          bet['result'] = 'Win confirmed by user; final score not provided'
          bet['settledAt'] = timestamp
          if 'user-confirmed-result' not in bet.get('tags', []):
              bet.setdefault('tags', []).append('user-confirmed-result')
          suffix = ' User confirmed the wager won; payout 257,500 VND and net profit 132,500 VND. Final match score was not provided.'
          if suffix.strip() not in bet.get('notes', ''):
              bet['notes'] = bet.get('notes', '') + suffix
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          rm -f .github/workflows/settle-hearts-sturm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json .github/workflows/settle-hearts-sturm.yml
          git commit -m "Settle Hearts vs Sturm Graz bet as win"
          git push
