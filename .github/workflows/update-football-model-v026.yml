name: Update football model v0.2.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-football-model-v026.yml

permissions:
  contents: write

jobs:
  update-football-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update football model documents
        shell: python
        run: |
          from pathlib import Path

          rules_path = Path("MODEL_RULES_FOOTBALL_V0.2.6.md")
          rules_path.write_text(r'''# Football Model Rules v0.2.6

**Effective date:** 2026-07-30  
**Status:** Active evaluation rule  
**Base:** This addendum extends `MODEL_RULES_FOOTBALL_V0.2.5.md`, `MODEL_CHANGELOG.md`, and `FOOTBALL_BETTING_PROCEDURE.md`. It takes precedence where aggregate-chase intensity, next-goal state transitions, correlated live evidence, or halftime multi-goal totals conflict with an earlier interpretation.

## Knockout chase calibration and next-goal reset

### Sport and markets affected

Football prematch and live totals, team totals, 1X2, and Asian handicaps in two-legged or single-match knockout fixtures, with special emphasis on halftime and second-half markets requiring two or more additional goals.

### Triggering evidence

- Gornik Zabrze vs Fenerbahce, live full-match Over 3.5 at 1-1 and 45:40: Gornik trailed only 2-1 on aggregate and needed one goal to force extra time, while the wager required two more regulation-time goals.
- The original assessment treated the state as a strong forced-chase environment and assigned a 56-60% probability to two or more second-half goals. The provisional in-play review at minute 85 showed a structural error independent of the eventual result: the model priced the need for the next goal but did not sufficiently price what would happen after that goal.
- A Gornik equalizer would have reset the aggregate to level and made extra time available, creating a plausible reduction in immediate scoring urgency. The prior model treated every next-goal branch as persistently goal-positive.
- First-half xG, xGOT, big chances, shots on target, box shots, and box touches were used as if they were largely independent signals even though several arose from the same chance sequences.
- This update is based on the state-transition and evidence-correlation defect, not on declaring the still-open wager settled.

### Previous rule

The model separated controlled and forced-chase branches and increased the multi-goal tail when a trailing team had to attack. It did not require a formal distinction between a team needing one goal to level the aggregate and a team needing multiple goals, did not require a post-next-goal aggregate reset tree, and did not explicitly discount correlated chance indicators.

## Active rules

### 1. Goals-required tier

For every knockout assessment, classify the trailing team's current requirement before applying a chase uplift:

- `single-goal-to-level`: one goal would level the aggregate or force extra time.
- `single-goal-to-qualify`: one goal would put the team ahead on aggregate or qualify it in regulation.
- `multi-goal-chase`: at least two goals are still required to level or qualify.
- `no-chase`: the current score already qualifies the team or the team has no rational need to increase attacking risk.

Do not apply the strong multi-goal forced-chase uplift merely because a team is trailing. The automatic late multi-goal-tail increase in v0.2.5 applies only to `multi-goal-chase` states and only when substitutions, fullback height, tempo, or observed behavior confirm that the team is accepting transition risk.

### 2. Mandatory next-goal state tree

For any live total or team total requiring two or more additional goals, build explicit branches for:

1. the aggregate-trailing team scoring next;
2. the aggregate-leading team scoring next;
3. no goal through the next material time checkpoint.

For each branch, recalculate:

- aggregate score;
- goals still required by each team;
- whether extra time becomes available or remains avoidable;
- expected attacking urgency for the next 5-10 minutes;
- transition exposure;
- probability of the subsequent goal needed by the wager.

A next goal cannot be treated only as evidence that the match is open. Its effect on future incentives must be priced separately.

### 3. Aggregate-equalizer reset

When the trailing team scores and the aggregate becomes level with extra time available:

- apply an `aggregate-reset` branch;
- reduce immediate combined scoring intensity for the next 5-10 minutes unless observed tactics, substitutions, fatigue, or competition rules clearly support continued regulation-time aggression;
- do not assume that both teams will continue chasing a regulation winner;
- widen the probability interval because some teams accept extra time while others continue attacking.

If the market still requires another goal after the aggregate equalizer, this reset risk must be reflected directly in fair odds and edge calculations.

### 4. Correlated live-evidence adjustment

Treat xG, xGOT, big chances, shots on target, box shots, and box touches as partially correlated evidence.

- Group metrics arising from the same attacking sequence into a `chance cluster` rather than counting each metric as independent confirmation.
- Use xG and xGOT together to distinguish chance creation from shot execution. High xG with materially lower xGOT requires regression unless missed chances were clearly repeatable tactical products.
- Four shots on target from low xG do not justify the same forward scoring rate as four high-quality shots on target.
- Big chances, box shots, and box touches may strengthen a read, but they cannot each add a full separate probability uplift when generated by the same passages of play.
- When only a static halftime snapshot is available, apply an additional persistence penalty unless the previous 10-15 minutes or multiple snapshots confirm continuing chance creation.

### 5. Halftime multi-goal total gate

For a halftime or early-second-half total that requires at least two additional goals:

- require the normal uncertainty-adjusted edge plus an additional two-percentage-point buffer when the trailing team is in a `single-goal-to-level` state and the first additional goal could trigger an aggregate reset;
- under the active v0.2.3 restriction, this normally means at least seven percentage points over the relevant breakeven probability for an `OFFICIAL BET`;
- require an independently supported pathway to the second required goal, not only a strong case for the next goal;
- require either persistent chance creation over the previous 10-15 minutes or multiple independent evidence groups, such as tactical transition exposure plus high-quality chance production;
- cap the recommendation at `LEAN` when the main thesis is only that the trailing team should score once to force extra time;
- prefer whole-goal protection when the price reasonably compensates for the push outcome.

### 6. Branch weighting discipline

The forced-chase/open-transition branch must not exceed the controlled or reset branches solely because the match is a knockout tie.

Increase its weight only when supported by at least two of the following:

- two or more goals still required;
- attacking substitutions;
- visibly advanced fullbacks or wingbacks;
- reduced defensive numbers;
- repeated transition chances;
- high-quality chance persistence over at least 10 minutes;
- cards or fatigue materially weakening defensive containment.

If these conditions are absent, use a wider interval and return `LEAN` or `NO BET` when the edge is not robust.

### 7. Required recommendation output

For applicable knockout recommendations, show:

- `Goals-required tier`
- `Next-goal state tree`
- `Aggregate-reset risk`
- `Chance-quality and correlation check`
- `Late-game and stoppage-time branch`
- `Market implication`

Tag official bets with `single-goal-to-level`, `multi-goal-chase`, `aggregate-reset`, and `chance-cluster-adjusted` when applicable.

## Expected benefit

Reduce overpricing of halftime overs when only the next goal is strongly incentivized, improve calibration after aggregate-equalizing goals, prevent double-counting of correlated live metrics, and make multi-goal total recommendations more selective and reproducible.

## Possible downside

The additional state tree can slow live analysis, may miss matches that remain open after an aggregate equalizer, and will produce more `LEAN` and `NO BET` decisions when data persistence cannot be verified.

## Review threshold

Review after the next 10 settled official football totals assessed under v0.2.6, including at least five knockout or aggregate-state totals if available. Report separately for `single-goal-to-level` versus `multi-goal-chase`, totals requiring one versus two-or-more additional goals, whether an aggregate reset occurred, whether the forced-chase branch was behaviorally confirmed, estimated versus realized probability of two or more remaining goals, closing-line quality, ROI, and qualitative process accuracy.
''', encoding="utf-8")

          changelog_path = Path("MODEL_CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = changelog.replace(
              "Football recommendations must follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_RULES_FOOTBALL_V0.2.5.md`, and this changelog.",
              "Football recommendations must follow `FOOTBALL_BETTING_PROCEDURE.md`, `MODEL_RULES_FOOTBALL_V0.2.6.md`, and this changelog."
          )
          v026_entry = r'''## v0.2.6 — 2026-07-30

### Football knockout chase calibration, next-goal reset, and correlated-evidence control

**Status:** Active evaluation rule  
**Detailed implementation:** `MODEL_RULES_FOOTBALL_V0.2.6.md` and `FOOTBALL_BETTING_PROCEDURE.md`

**Triggering evidence**

- Gornik Zabrze vs Fenerbahce, live Over 3.5 at 1-1 and 45:40: Gornik needed one goal to level the aggregate and force extra time, but the wager needed two additional regulation-time goals.
- The provisional in-play review identified a logic defect independent of final settlement: the model priced the incentive for the next goal but did not adequately price the lower-urgency state that could follow an aggregate equalizer.
- The assessment also treated xG, xGOT, big chances, shots on target, box shots, and box touches as more independent than they were, inflating confidence from overlapping chance sequences.

**Previous rule**

The aggregate-state model separated controlled and forced-chase branches and increased transition variance when a trailing team attacked. It did not formally distinguish one-goal-to-level from multi-goal chase states, require a next-goal state tree, apply an aggregate-equalizer reset, or discount correlated live chance indicators.

**New rule**

- Classify every knockout state as `single-goal-to-level`, `single-goal-to-qualify`, `multi-goal-chase`, or `no-chase` before applying any chase uplift.
- Reserve the automatic late multi-goal-tail increase for confirmed `multi-goal-chase` behavior. A team needing one goal to force extra time does not automatically create a strong two-goal remaining tail.
- For any total requiring two or more additional goals, build a next-goal state tree and reprice incentives after each possible scorer.
- When a trailing-team goal levels the aggregate and makes extra time available, apply an `aggregate-reset` branch and reduce immediate scoring intensity unless observed behavior supports continued aggression.
- Treat xG, xGOT, big chances, shots on target, box shots, and box touches as correlated chance-cluster evidence rather than independent probability uplifts.
- Static halftime screenshots receive a persistence penalty unless the previous 10-15 minutes or multiple snapshots confirm continuing high-quality chance creation.
- Halftime or early-second-half totals needing two or more additional goals require an extra two-percentage-point edge buffer when one goal could reset the aggregate to level. Under the active v0.2.3 restriction, this normally means at least seven points over breakeven for `OFFICIAL BET` status.
- Cap the output at `LEAN` when the thesis establishes only a strong next-goal case but not an independently supported pathway to the second required goal.
- Prefer whole-goal protection when the push boundary is reasonably priced.

**Expected benefit**

Improve calibration of knockout totals, prevent overstatement of forced-chase intensity, price post-equalizer caution explicitly, and reduce double-counting of overlapping live metrics.

**Possible downside**

The added branching can slow live decisions, may miss some genuinely open ties, and will increase the number of passed opportunities.

**Review threshold**

Review after the next 10 settled official football totals assessed under v0.2.6, including at least five knockout totals if available. Separate `single-goal-to-level` from `multi-goal-chase`, one-goal from two-or-more-goal requirements, aggregate-reset occurrence, closing-line quality, calibration, ROI, and process accuracy.

---

'''
          marker = "## v0.2.5 — 2026-07-29"
          if "## v0.2.6 — 2026-07-30" not in changelog:
              changelog = changelog.replace(marker, v026_entry + marker)
          changelog_path.write_text(changelog, encoding="utf-8")

          procedure_path = Path("FOOTBALL_BETTING_PROCEDURE.md")
          procedure = procedure_path.read_text(encoding="utf-8")
          procedure = procedure.replace("**Effective date:** 2026-07-29", "**Effective date:** 2026-07-30")
          procedure = procedure.replace("`MODEL_RULES_FOOTBALL_V0.2.5.md`", "`MODEL_RULES_FOOTBALL_V0.2.6.md`")

          live_anchor = "A single screenshot is a snapshot, not proof of a persistent pattern. When possible, compare the previous 8–15 minutes with the full-match profile."
          live_addition = live_anchor + r'''

Apply a correlated-evidence check:

- xG, xGOT, big chances, shots on target, box shots, and box touches from the same sequence are not independent signals;
- group overlapping indicators into chance clusters;
- regress high xG when xGOT, repeatability, or recent persistence does not support the same forward scoring rate;
- apply an additional persistence penalty to static halftime snapshots when the previous 10–15 minutes cannot be verified.'''
          if "Apply a correlated-evidence check:" not in procedure:
              procedure = procedure.replace(live_anchor, live_addition)

          section8_start = procedure.index("## 8. Aggregate-state procedure")
          section9_start = procedure.index("## 9. Stoppage-time and late-game module")
          new_section8 = r'''## 8. Aggregate-state procedure

For knockout ties, first classify the goals-required tier:

- `single-goal-to-level`: one goal levels the aggregate or forces extra time;
- `single-goal-to-qualify`: one goal moves the team ahead on aggregate or qualifies it;
- `multi-goal-chase`: at least two goals are still required;
- `no-chase`: the current score already qualifies the team or creates no rational need for greater risk.

Model two separate effects:

- the aggregate-leading team's sustained attacking urgency;
- the aggregate-leading team's transition scoring opportunity.

A large aggregate lead can reduce deliberate attacking volume while leaving counterattack scoring unchanged or higher.

Model the trailing side's chase using:

- goals still required;
- time remaining;
- attacking substitutions;
- fullback height and numbers committed forward;
- cards, fatigue, and defensive structure;
- willingness to accept transition risk.

An aggregate gap of three or more goals is a `large-aggregate-gap` state and requires two explicit branches:

1. **Controlled branch:** the leader manages territory and the trailing team cannot sustain pressure.
2. **Forced-chase/open-transition branch:** the trailing team commits numbers, increasing its own attacking rate and the leader's counterattack rate.

Do not apply the strong multi-goal forced-chase uplift merely because a team trails. From minute 60 onward, the automatic multiple-goal-tail increase applies only when the team still needs at least two goals and observed behavior confirms the chase.

For any total or team total requiring two or more additional goals, build a mandatory next-goal state tree:

1. trailing team scores next;
2. leading team scores next;
3. no goal through the next material checkpoint.

After each branch, recalculate the aggregate score, goals still required, extra-time availability, immediate attacking urgency, transition exposure, and probability of the subsequent goal required by the wager.

When a trailing-team goal levels the aggregate and extra time becomes available, apply an `aggregate-reset` branch. Reduce immediate scoring intensity for the next 5–10 minutes unless tactics, substitutions, fatigue, or observed behavior support continued regulation-time aggression.

A large aggregate cushion alone can never justify an under, an underdog handicap, or a short-favorite fade.

---

'''
          procedure = procedure[:section8_start] + new_section8 + procedure[section9_start:]

          section11_anchor = "- forced-chase underdog handicaps require an additional two-point buffer, normally at least seven points over breakeven."
          section11_add = section11_anchor + r'''
- halftime or early-second-half totals requiring two or more additional goals also require an additional two-point buffer when the trailing team is `single-goal-to-level` and the first goal could trigger an aggregate reset;
- cap such a market at `LEAN` when the analysis supports only the next goal and does not independently support the subsequent goal required for settlement.'''
          if "halftime or early-second-half totals requiring two or more additional goals" not in procedure:
              procedure = procedure.replace(section11_anchor, section11_add)

          market_anchor = "### Halftime Under 1.5\n\nTreat as high variance. Prefer Under 2 or Under 2.25 when the added protection is reasonably priced. Require exceptional suppression and a larger edge for Under 1.5."
          market_add = market_anchor + r'''

### Knockout halftime overs requiring two or more additional goals

- Identify the goals-required tier before pricing the over.
- Build the next-goal state tree and include aggregate-reset risk.
- Require an independently supported pathway to the second required goal.
- Require persistent high-quality chance creation over the previous 10–15 minutes or multiple independent evidence groups.
- When one goal would level the aggregate and make extra time available, require at least a seven-percentage-point uncertainty-adjusted edge under the active evaluation restriction.
- If only the next goal is strongly supported, return `LEAN` or `NO BET`.
- Prefer whole-goal protection when reasonably priced.'''
          if "### Knockout halftime overs requiring two or more additional goals" not in procedure:
              procedure = procedure.replace(market_anchor, market_add)

          tag_anchor = "- `model-review`"
          tag_add = tag_anchor + r'''
- `single-goal-to-level`
- `multi-goal-chase`
- `aggregate-reset`
- `chance-cluster-adjusted`'''
          if "- `chance-cluster-adjusted`" not in procedure:
              procedure = procedure.replace(tag_anchor, tag_add)

          procedure_path.write_text(procedure, encoding="utf-8")

      - name: Commit model update
        run: |
          git config user.name "SlipTrace Model Bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add MODEL_RULES_FOOTBALL_V0.2.6.md MODEL_CHANGELOG.md FOOTBALL_BETTING_PROCEDURE.md
          git commit -m "Update football model to v0.2.6"
          git push
