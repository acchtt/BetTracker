name: Update Football v0.2.11 Changelog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-football-corners-v0.2.11.yml

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert football v0.2.11 changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('MODEL_CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## v0.2.11 — 2026-07-31'
          if marker in text:
              raise SystemExit(0)

          entry = '''## v0.2.11 — 2026-07-31

### Mandatory football corner-market scan

**Status:** Active evaluation rule  
**Detailed implementation:** `MODEL_RULES_FOOTBALL_V0.2.11.md`

**Sport and markets affected**

All football prematch and live assessments; full-match, half, team, handicap, and remaining-match corner markets.

**Triggering evidence**

- The user requested that total-corners markets be evaluated across all matches rather than only when a specific match happens to show a corner angle.
- Existing football analysis treated corners mainly as supporting evidence for goal markets instead of pricing corner markets independently.

**Previous rule**

Corners appeared in the live evidence hierarchy, but routine previews and reassessments were not required to scan the bookmaker's corner markets.

**New rule**

- Scan available corner markets in every football preview and material live reassessment.
- Price corners independently from match-result and goal-total opinions.
- Use direct corner-generation evidence: current count, recent rate, crosses, blocked shots, byline entries, defensive clearances, width, score incentives, substitutions, and settlement basis.
- Possession, xG, shots, and box touches cannot substitute for direct corner evidence.
- Treat short corner sequences as correlated clusters and require persistence before live-over upgrades.
- Apply v0.2.10 recommendation tiers and v0.2.9 timing rules, with faster quote expiry for live corners.
- During initial calibration, maximum recommended corner exposure is normally 0.125u per match, including correlated corner positions.
- Track corner performance separately by competition, subtype, prematch/live, direction, recommendation tier, score state, entry count/minute, closing line, and ROI.

**Expected benefit**

Broaden market coverage while using evidence specific to how corners are generated.

**Possible downside**

Corner rates are volatile, settlement definitions vary, and short live samples can be misleading.

**Review threshold**

Review after 20 settled corner wagers or 40 fully documented corner-market scans.

---

'''

          first_sep = text.find('---\n')
          if first_sep == -1:
              text = text.rstrip() + '\n\n---\n\n' + entry
          else:
              insert_at = first_sep + len('---\n')
              text = text[:insert_at] + '\n' + entry + text[insert_at:]
          path.write_text(text, encoding='utf-8')
      - name: Commit changelog update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MODEL_CHANGELOG.md
          git commit -m 'Document football corner-market scan v0.2.11' || exit 0
          git push
