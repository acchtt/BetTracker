name: Settle Gornik Fenerbahce Over 3.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/settle-gornik-fener-over35.yml

permissions:
  contents: write

jobs:
  settle-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ledger settlement
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sync_id = "eval-20260729-gornik-fenerbahce-over-3-5"
          bet = next(item for item in data["bets"] if item.get("syncId") == sync_id)

          settled_at = "2026-07-30T01:07:00Z"
          data["version"] = settled_at
          bet["updatedAt"] = settled_at
          bet["status"] = "loss"
          bet["result"] = "Gornik Zabrze 1-1 Fenerbahce after 90 minutes (Loss; Over 3.5 total goals)"
          bet["payoutVnd"] = 0
          bet["netProfitVnd"] = -125000
          bet["netUnits"] = -0.25
          bet["settledAt"] = settled_at
          bet["finalRegulationScore"] = "Gornik Zabrze 1-1 Fenerbahce"
          bet["finalAggregateAfter90"] = "Fenerbahce 2-1 Gornik Zabrze; Fenerbahce qualified"
          bet["finalStats"] = {
              "xG": "Gornik Zabrze 0.59-2.66 Fenerbahce",
              "xGOT": "Gornik Zabrze 0.97-1.35 Fenerbahce",
              "possession": "Gornik Zabrze 48%-52% Fenerbahce",
              "shots": "Gornik Zabrze 15-14 Fenerbahce",
              "shotsOnTarget": "Gornik Zabrze 6-2 Fenerbahce",
              "bigChances": "Gornik Zabrze 1-4 Fenerbahce",
              "shotsInsideBox": "Gornik Zabrze 5-10 Fenerbahce",
              "shotsOutsideBox": "Gornik Zabrze 10-4 Fenerbahce",
              "blockedShots": "Gornik Zabrze 5-5 Fenerbahce",
              "boxTouches": "Gornik Zabrze 30-25 Fenerbahce",
              "corners": "Gornik Zabrze 9-7 Fenerbahce",
              "yellowCards": "Gornik Zabrze 4-6 Fenerbahce"
          }

          additions = [
              "user-confirmed-result",
              "loss",
              "model-review",
              "single-goal-to-level",
              "aggregate-reset-risk",
              "chance-cluster-overcount",
              "v0.2.6-trigger"
          ]
          tags = bet.setdefault("tags", [])
          for tag in additions:
              if tag not in tags:
                  tags.append(tag)

          settlement_review = (
              " Settlement confirmed by the user: regulation ended Gornik Zabrze 1-1 Fenerbahce, "
              "so the full-match Over 3.5 lost. Payout 0 VND; net loss 125,000 VND (-0.25u). "
              "Final statistics were xG 0.59-2.66, xGOT 0.97-1.35, shots 15-14, shots on target 6-2, "
              "big chances 1-4, inside-box shots 5-10, box touches 30-25 and corners 9-7. "
              "Result review: no additional regulation-time goal was scored after the 1-1 halftime entry. "
              "Process review: execution met the stated odds cutoff and stake cap, but the model overstated the two-goal second-half tail. "
              "Gornik were in a single-goal-to-level state, so one goal could have made extra time available and reduced immediate urgency; "
              "the recommendation priced the next-goal incentive without an independently supported path to the second required goal. "
              "The halftime xG, xGOT, big chances, shots on target, box shots and box touches were also partially correlated and were weighted too independently. "
              "This deterministic state-transition and evidence-correlation defect triggered football model v0.2.6, including goals-required tiers, a mandatory next-goal tree, aggregate-reset risk, chance-cluster adjustment and a seven-point gate for comparable knockout halftime overs."
          )
          if "Settlement confirmed by the user: regulation ended Gornik Zabrze 1-1 Fenerbahce" not in bet.get("notes", ""):
              bet["notes"] = bet.get("notes", "") + settlement_review

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "Settle Gornik Fenerbahce Over 3.5 as loss" || exit 0
          git push
