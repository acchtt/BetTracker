name: Merge TES LGD execution timing correction

on:
  push:
    branches: [main]
    paths:
      - pending/2026-08-01-tes-lgd-game3-over-33-minutes-open.json
      - .github/workflows/merge-tes-lgd-execution-timing-correction.yml

permissions:
  contents: write

jobs:
  merge-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge corrected record into ledger
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ledger_path = Path("ledger.json")
          source_path = Path("pending/2026-08-01-tes-lgd-game3-over-33-minutes-open.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          corrected = json.loads(source_path.read_text(encoding="utf-8"))

          sync_id = corrected.get("syncId")
          replaced = False
          for index, bet in enumerate(ledger.get("bets", [])):
              if bet.get("syncId") == sync_id:
                  ledger["bets"][index] = corrected
                  replaced = True
                  break
          if not replaced:
              ledger.setdefault("bets", []).insert(0, corrected)

          ledger["version"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          metadata = ledger.setdefault("mergeMetadata", {})
          metadata["lastCorrection"] = "TES vs LGD Game 3 execution timing clarified as immediate same-state price jump; material-move exclusion unchanged."
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit authoritative ledger correction
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Correct TES LGD execution timing note"
            git push
          fi
