name: Update Football v0.2.10 Changelog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-football-tier-v0.2.10.yml

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert football v0.2.10 changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('MODEL_CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## v0.2.10 — 2026-07-31'
          if marker in text:
              raise SystemExit(0)

          entry = '''## v0.2.10 — 2026-07-31

### Football recommendation tiers and reduced-stake leans

**Status:** Active evaluation rule  
**Detailed implementation:** `MODEL_RULES_FOOTBALL_V0.2.10.md`

**Sport and markets affected**

All football pre-match and live recommendations.

**Triggering evidence**

- Caracas vs Santa Fe produced two correct watchlist leans: Over 2.25 and Santa Fe handicap.
- Ferencvaros vs Twente Under 3 was a user-placed lean and lost.
- Official recommendations also remained mixed, showing that realized outcomes alone should not determine the label.
- The prior `LEAN = 0u` rule combined modest positive-EV opportunities with non-actionable directional opinions.

**Previous rule**

`OFFICIAL BET` was actionable at 0.25u, while every `LEAN` defaulted to 0u and required an official upgrade before placement.

**New rule**

- Keep the required labels `OFFICIAL BET`, `LEAN`, and `NO BET`.
- Divide leans into `LEAN — SMALL` at 0.125u and `LEAN — WATCH` at 0u.
- `OFFICIAL BET` normally requires midpoint settlement-weighted EV of at least +6% and lower-bound EV of at least +2%, with all mandatory verification complete.
- `LEAN — SMALL` normally requires midpoint EV of at least +3%, non-negative lower-bound EV, verified state and settlement, and a stable market without a recent major event.
- `LEAN — WATCH` remains non-actionable when the direction is plausible but price, data, uncertainty, or volatility prevents a reduced-stake recommendation.
- Positively correlated lean positions in the same match share a combined 0.125u cap; total correlated exposure normally remains at or below 0.25u when an official position already exists.
- Only confirmed wagers enter betting profit/loss. Unplaced leans remain separate directional and calibration records.
- Do not retroactively promote winning leans or downgrade losing official recommendations solely from results.

**Expected benefit**

Allow disciplined reduced exposure on modest positive edges without weakening the official-bet standard, while separating actionable leans from watchlist opinions.

**Possible downside**

The extra tier can increase bet frequency and admit marginal positions if uncertainty ranges are too narrow.

**Review threshold**

Review after 20 settled `LEAN — SMALL` wagers and 20 settled model-approved official football wagers, or after 40 fully documented football recommendations under v0.2.10.

---

'''

          first_sep = text.find('---\n')
          if first_sep == -1:
              text = text.rstrip() + '\n\n---\n\n' + entry
          else:
              insert_at = first_sep + len('---\n')
              text = text[:insert_at] + '\n' + entry + text[insert_at:]
          path.write_text(text, encoding='utf-8')
      - name: Commit changelog update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MODEL_CHANGELOG.md
          git commit -m 'Document football recommendation tiers v0.2.10' || exit 0
          git push