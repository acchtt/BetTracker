name: Merge DK GenG Game 2 settlement

on:
  push:
    branches: [main]
    paths:
      - pending/2026-08-01-dk-geng-game2-over-33-minutes-settled.json
      - .github/workflows/merge-dk-geng-g2-settlement.yml

permissions:
  contents: write

jobs:
  merge-settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge settled record into ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          source_path = Path("pending/2026-08-01-dk-geng-game2-over-33-minutes-settled.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          settled = json.loads(source_path.read_text(encoding="utf-8"))

          replaced = False
          for index, bet in enumerate(ledger.get("bets", [])):
              if bet.get("syncId") == settled.get("syncId"):
                  ledger["bets"][index] = settled
                  replaced = True
                  break
          if not replaced:
              ledger.setdefault("bets", []).insert(0, settled)

          ledger["version"] = "2026-08-01T12:35:00Z"
          metadata = ledger.setdefault("mergeMetadata", {})
          sources = metadata.setdefault("pendingSources", [])
          source_name = str(source_path)
          if source_name not in sources:
              sources.append(source_name)
              metadata["officialRecordsUpdated"] = int(metadata.get("officialRecordsUpdated", 0)) + 1

          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit authoritative settlement
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Settle DK vs Gen.G Game 2 Over 33 as loss"
            git push
          fi
