                  'tags': ['football', 'official-after-user-confirmation', 'live-halftime', 'asian-handicap', 'win', 'settled', 'post-hold-reconciliation']
              },
              {
                  'syncId': 'football-20260804-celtic-dundee-over-2-75-live',
                  'updatedAt': '2026-08-04T08:19:00+07:00',
                  'event': 'Celtic vs Dundee FC',
                  'league': 'Scottish Premiership',
                  'bet': 'Over 2.75 goals',
                  'odds': 1.88,
                  'stakeVnd': 250000,
                  'stakeUnits': 0.25,
                  'unitValueVndAtPlacement': 1000000,
                  'potentialPayoutVnd': 470000,
                  'potentialProfitVnd': 220000,
                  'payoutVnd': 0,
                  'netProfitVnd': -250000,
                  'netUnits': -0.25,
                  'status': 'loss',
                  'result': 'Celtic won 1-0. Over 2.75 lost in full.',
                  'finalScore': 'Celtic 1-0 Dundee FC',
                  'eventDate': '2026-08-04',
                  'marketType': 'Asian total',
                  'timing': 'live',
                  'bookmaker': 'BK8',
                  'slipId': '872190818084147201',
                  'betId': '872190818084147201',
                  'settlementId': '872190818084147200',
                  'entryScore': '0-0',
                  'entryMinute': '23:26 independently observed live clock',
                  'sportsbookDisplayedMatchClock': '35:46',
                  'independentLiveMatchClock': '23:26',
                  'lastSynchronizedEvidenceMinute': '21:46',
                  'placedAt': '2026-08-04T01:54:00+07:00',
                  'settlementBasis': 'Over 2.75 is split between Over 2.5 and Over 3.0; one total goal lost both halves.',
                  'modelRecommendation': {
                      'modelVersionAtPlacement': 'football-v0.2.24',
                      'market': 'Over 2.75 goals',
                      'quotedOdds': 1.78,
                      'acceptedOdds': 1.88,
                      'recommendedStakeUnits': 0.25,
                      'processGradeAfterReview': 'poor',
                      'reviewConclusion': 'Should have remained WATCH or NO BET because the principal snapshot had zero xGOT and zero shots on target and the line-resilience claim was not quantified.'
                  },
                  'execution': {
                      'acceptedOdds': 1.88,
                      'actualStakeUnits': 0.25,
                      'actualStakeVnd': 250000,
                      'withinFootballStakeCap': True,
                      'priceAboveFootballMinimum': True,
                      'quotedToAcceptedOddsMove': 0.10,
                      'freshSynchronizedStateAtAcceptedPrice': False,
                      'executionValidityGatePassed': False,
                      'deviations': ['Accepted odds moved from 1.78 to 1.88 without a fresh synchronized reprice.']
                  },
                  'resultVerified': True,
                  'executionValid': False,
                  'modelAttributed': False,
                  'dedupeKey': 'settlementId:872190818084147200',
                  'verificationSource': 'User-supplied sportsbook ticket and final score.',
                  'tags': ['football', 'official-after-user-confirmation', 'scottish-premiership', 'live', 'asian-total', 'over-2-75', 'loss', 'settled', 'execution-invalid', 'post-hold-reconciliation']
              },
              {
                  'syncId': 'football-20260804-sarmiento-independiente-rivadavia-minus-0-25-remaining-match',
                  'updatedAt': '2026-08-04T08:19:00+07:00',
                  'event': 'CA Sarmiento vs Independiente Rivadavia',
                  'league': 'Argentina Liga Profesional',
                  'bet': 'Independiente Rivadavia -0.25',
                  'odds': 1.95,
                  'stakeVnd': 250000,
                  'stakeUnits': 0.25,
                  'unitValueVndAtPlacement': 1000000,
                  'potentialPayoutVnd': 487500,
                  'potentialProfitVnd': 237500,
                  'payoutVnd': 125000,
                  'netProfitVnd': -125000,
                  'netUnits': -0.125,
                  'status': 'half-loss',
                  'result': 'The match finished CA Sarmiento 2-1 Independiente Rivadavia. The remaining segment after halftime finished 0-0, so Independiente -0.25 lost half the stake.',
                  'finalScore': 'CA Sarmiento 2-1 Independiente Rivadavia',
                  'eventDate': '2026-08-04',
                  'marketType': 'Asian handicap',
                  'timing': 'live-halftime',
                  'bookmaker': 'BK8',
                  'slipId': '872219483308777472',
                  'betId': '872219483308777472',
                  'settlementId': None,
                  'entryScore': 'CA Sarmiento 2-1 Independiente Rivadavia',
                  'entryMinute': 'Halftime',
                  'settlementScope': 'remaining match',
                  'remainingSegmentScore': '0-0',
                  'placedAt': None,
                  'settlementBasis': 'Independiente -0.25 was split between remaining-match draw no bet and -0.5. A drawn remaining segment pushed half and lost half.',
                  'modelRecommendation': {
                      'modelVersionAtPlacement': 'football-v0.2.25',
                      'market': 'Independiente Rivadavia -0.25 remaining match',
                      'quotedOdds': 1.98,
                      'acceptedOdds': 1.95,
                      'recommendedStakeUnits': 0.25,
                      'processGradeAfterReview': 'borderline',
                      'reviewConclusion': 'Cumulative dominance was partly concentrated in one penalty sequence; the remaining-segment draw half-loss was underweighted and no fresh post-halftime evidence was available.'
                  },
                  'execution': {
                      'acceptedOdds': 1.95,
                      'actualStakeUnits': 0.25,
                      'actualStakeVnd': 250000,
                      'withinFootballStakeCap': True,
                      'priceAboveFootballMinimum': True,
                      'quotedToAcceptedOddsMove': -0.03,
                      'freshSynchronizedStateAtAcceptedPrice': False,
                      'executionValidityGatePassed': False,
                      'deviations': ['Accepted odds moved from 1.98 to 1.95 without a fresh synchronized reprice.']
                  },
                  'resultVerified': True,
                  'executionValid': False,
                  'modelAttributed': False,
                  'dedupeKey': 'slipId:872219483308777472',
                  'verificationSource': 'User-supplied sportsbook ticket and final score.',
                  'tags': ['football', 'official-after-user-confirmation', 'argentina-liga-profesional', 'live-halftime', 'remaining-match', 'asian-handicap', 'half-loss', 'settled', 'execution-invalid', 'post-hold-reconciliation']
              }
          ]

          existing_keys = set()
          for bet in bets:
              for field in ('settlementId', 'betId', 'slipId'):
                  value = bet.get(field)
                  if value not in (None, ''):
                      existing_keys.add(f'{field}:{value}')

          added = 0
          for entry in new_entries:
              keys = [
                  f"settlementId:{entry['settlementId']}" if entry.get('settlementId') else None,
                  f"betId:{entry['betId']}" if entry.get('betId') else None,
                  f"slipId:{entry['slipId']}" if entry.get('slipId') else None,
              ]
              if any(key in existing_keys for key in keys if key):
                  continue
              bets.insert(0, entry)
              added += 1
              for key in keys:
                  if key:
                      existing_keys.add(key)

          data['version'] = '2026-08-04T08:19:00+07:00'
          data['bets'] = bets

          # Verify the five post-hold tickets and arithmetic.
          target_slips = {
              '871579398091456513',
              '871582095108648961',
              '871584565931237377',
              '872190818084147201',
              '872219483308777472',
          }
          recent = [b for b in bets if str(b.get('slipId', '')) in target_slips]
          if len(recent) != 5:
              raise SystemExit(f'Expected 5 reconciled post-hold tickets, found {len(recent)}')
          stake_total = sum(int(b['stakeVnd']) for b in recent)
          payout_total = sum(int(b.get('payoutVnd', 0)) for b in recent)
          net_total = sum(int(b['netProfitVnd']) for b in recent)
          units_total = sum(float(b['netUnits']) for b in recent)
          if (stake_total, payout_total, net_total) != (875000, 848750, -26250):
              raise SystemExit(f'Post-hold arithmetic mismatch: {(stake_total, payout_total, net_total)}')
          if abs(units_total - (-0.02625)) > 1e-9:
              raise SystemExit(f'Post-hold units mismatch: {units_total}')

          expected_count = original_count - 1 + added
          if len(bets) != expected_count:
              raise SystemExit(f'Unexpected record count: expected {expected_count}, got {len(bets)}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Reconciled ledger: original={original_count}, added={added}, final={len(bets)}')
          print(f'Post-hold subtotal: stake={stake_total}, payout={payout_total}, net={net_total}')
          PY

      - name: Commit reconciled ledger and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/reconcile-football-ledger.yml
          git config user.name "SlipTrace Ledger Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.json .github/workflows/reconcile-football-ledger.yml
          git commit -m "Reconcile football ledger [ledger-reconciled]"
          git push
