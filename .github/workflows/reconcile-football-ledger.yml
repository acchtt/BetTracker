name: Reconcile football ledger

on:
  push:
    paths:
      - .github/workflows/reconcile-football-ledger.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[ledger-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile ledger.json
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          bets = data.get('bets')
          if not isinstance(bets, list):
              raise SystemExit('ledger.json does not contain a bets array')

          original_count = len(bets)

          # Confirmed duplicate: one settled record and one stale pending record
          # share the same Shanghai Port ticket. Keep the settled record.
          duplicate_slip = '871372429284040704'
          matching = [b for b in bets if str(b.get('slipId', '')) == duplicate_slip]
          if len(matching) != 2:
              raise SystemExit(f'Expected exactly 2 Shanghai duplicate records, found {len(matching)}')

          def record_quality(record):
              status = str(record.get('status', '')).lower()
              settled = status in {'win', 'loss', 'push', 'half-win', 'half-loss', 'settled'}
              has_result = record.get('result') not in (None, '')
              has_net = record.get('netProfitVnd') is not None or record.get('netUnits') is not None
              return (settled, has_result, has_net, str(record.get('updatedAt', '')))

          keeper = max(matching, key=record_quality)
          keeper['resultVerified'] = True
          keeper['executionValid'] = True
          keeper['modelAttributed'] = True
          keeper['dedupeKey'] = f'slipId:{duplicate_slip}'
          keeper.setdefault('verificationNotes', []).append(
              'Settled record supersedes stale pending duplicate during 2026-08-04 reconciliation.'
          )
          bets = [b for b in bets if str(b.get('slipId', '')) != duplicate_slip]
          bets.insert(0, keeper)

          new_entries = [
              {
                  'syncId': 'football-posthold-fc-cincinnati-san-jose-cincinnati-minus-0-5-live',
                  'updatedAt': '2026-08-04T08:19:00+07:00',
                  'event': 'FC Cincinnati vs San Jose Earthquakes',
                  'league': 'Not supplied',
                  'bet': 'FC Cincinnati -0.5',
                  'odds': 2.06,
                  'stakeVnd': 125000,
                  'stakeUnits': 0.125,
                  'unitValueVndAtPlacement': 1000000,
                  'payoutVnd': 257500,
                  'netProfitVnd': 132500,
                  'netUnits': 0.1325,
                  'status': 'win',
                  'result': 'FC Cincinnati won 4-2. FC Cincinnati -0.5 won in full.',
                  'finalScore': 'FC Cincinnati 4-2 San Jose Earthquakes',
                  'eventDate': None,
                  'marketType': 'Asian handicap',
                  'timing': 'live',
                  'bookmaker': 'BK8',
                  'slipId': '871579398091456513',
                  'betId': '871579398091456513',
                  'settlementId': '871579398091456512',
                  'entryScore': '1-1',
                  'entryMinute': 'Not supplied',
                  'settlementBasis': 'FC Cincinnati had to win the match after 90 minutes plus regulation stoppage time.',
                  'execution': {
                      'acceptedOdds': 2.06,
                      'actualStakeUnits': 0.125,
                      'actualStakeVnd': 125000,
                      'withinFootballStakeCap': True,
                      'priceAboveFootballMinimum': True,
                      'executionValidityGatePassed': True,
                      'selectionAttribution': 'model-approved exact market and line',
                      'stakeAttribution': 'model-compliant under the then-active 0.125u LEAN tier'
                  },
                  'resultVerified': True,
                  'executionValid': True,
                  'modelAttributed': True,
                  'dedupeKey': 'settlementId:871579398091456512',
                  'verificationSource': 'User-supplied ticket IDs, payout and final result.',
                  'tags': ['football', 'official-after-user-confirmation', 'live', 'asian-handicap', 'win', 'settled', 'post-hold-reconciliation']
              },
              {
                  'syncId': 'football-posthold-club-leon-pachuca-under-1-75-live',
                  'updatedAt': '2026-08-04T08:19:00+07:00',
                  'event': 'Club Leon vs Pachuca',
                  'league': 'Not supplied',
                  'bet': 'Under 1.75 goals',
                  'odds': 1.89,
                  'stakeVnd': 125000,
