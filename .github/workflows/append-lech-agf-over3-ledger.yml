name: Append Lech AGF ledger entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append-lech-agf-over3-ledger.yml

permissions:
  contents: write

jobs:
  append-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update authoritative ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sync_id = "eval-20260729-lech-agf-over-3"
          now = "2026-07-29T17:39:00Z"

          entry = {
              "syncId": sync_id,
              "updatedAt": now,
              "event": "Lech Poznan vs AGF Aarhus — Second Leg",
              "league": "UEFA Champions League Qualifying",
              "bet": "Over 3 total goals",
              "odds": 2.27,
              "stakeVnd": 125000,
              "stakeUnits": 0.25,
              "potentialPayoutVnd": 283750,
              "potentialProfitVnd": 158750,
              "status": "pending",
              "result": "Pending",
              "eventDate": "2026-07-29",
              "marketType": "Totals",
              "timing": "live",
              "bookmaker": "BK8",
              "slipId": "870359860280733696",
              "entryScore": "Lech Poznan 0-1 AGF Aarhus",
              "entryAggregateScore": "Lech Poznan 4-2 AGF Aarhus",
              "entryMinute": "approximately 33:48",
              "settlementBasis": "Full-match total including the existing 0-1 score; 90 minutes plus regulation stoppage time; extra time excluded. Exactly 3 total goals is a push; 4 or more wins; 0-2 loses.",
              "modelRecommendation": {
                  "recommendationType": "official bet",
                  "market": "Over 3 total goals",
                  "quotedOdds": 1.97,
                  "minimumAcceptableOdds": 1.90,
                  "stakeUnits": 0.25,
                  "fairOddsRange": [1.64, 1.75],
                  "state": "Approximately 33:48, AGF led 1-0 and Lech led 4-2 on aggregate. Live indicators: xG 0.22-0.65, shots 3-4, shots on target 2-1, big chances 0-1, box touches 8-10, corners 4-0, possession 33%-67%.",
                  "reasoning": "AGF still needed two unanswered goals to force extra time, sustaining a forced-chase branch, while Lech retained transition scoring upside. The whole-goal line protected exactly three total goals with a push."
              },
              "execution": {
                  "odds": 2.27,
                  "stakeUnits": 0.25,
                  "stakeVnd": 125000,
                  "potentialPayoutVnd": 283750,
                  "sameMarketAndLine": True,
                  "priceAboveMinimum": True,
                  "withinStakeCap": True,
                  "deviations": []
              },
              "tags": [
                  "evaluation",
                  "official",
                  "official-after-user-confirmation",
                  "live-read",
                  "football",
                  "totals",
                  "whole-goal-protection",
                  "lineup-confirmed",
                  "competition-context",
                  "aggregate-state",
                  "forced-chase",
                  "stoppage-time-risk",
                  "model-generated",
                  "user-executed",
                  "price-above-model-cutoff",
                  "within-stake-cap"
              ],
              "notes": "Official live football bet confirmed by the user. Lech Poznan vs AGF Aarhus full-match Over 3 at 2.27 for 0.25u (125,000 VND), sportsbook slip #870359860280733696. Entry was approximately 33:48 with AGF leading 1-0 and Lech leading 4-2 on aggregate. Exactly three total goals returns the stake; four or more wins; two or fewer loses. Potential payout is 283,750 VND and potential profit is 158,750 VND (+0.3175u). Execution exceeded the model minimum acceptable odds of 1.90 and respected the active 0.25u football stake cap. Main thesis: AGF's continuing qualification chase increased their attacking commitment and Lech's transition opportunities. Main risks: combined xG was only 0.87, AGF's goal was deflected, and Lech could still qualify while controlling the match.",
              "placedAt": "2026-07-30T00:39:00+07:00",
              "addedAt": now,
              "createdAt": now
          }

          bets = data.setdefault("bets", [])
          existing = next((bet for bet in bets if bet.get("syncId") == sync_id), None)
          if existing is None:
              bets.insert(0, entry)
          else:
              existing.update(entry)

          data["version"] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit ledger entry
        run: |
          git config user.name "SlipTrace Ledger Bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add ledger.json
          git commit -m "Record Lech AGF Over 3 bet"
          git push
