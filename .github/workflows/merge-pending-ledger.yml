name: Merge pending bets into ledger

on:
  push:
    paths:
      - "pending/*.json"
      - "scripts/merge_pending_ledger.py"
      - ".github/workflows/merge-pending-ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-pending-ledger
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge official pending records
        run: python scripts/merge_pending_ledger.py

      - name: Commit updated ledger
        run: |
          if git diff --quiet -- ledger.json; then
            echo "ledger.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "Merge pending bets into authoritative ledger"
          git push

