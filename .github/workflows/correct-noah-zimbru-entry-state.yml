name: Correct Noah Zimbru entry state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-noah-zimbru-entry-state.yml

permissions:
  contents: write

jobs:
  correct-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct synchronized entry state
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = '2026-07-30T16:43:00Z'
          data['version'] = now
          bet = next(b for b in data['bets'] if b.get('syncId') == 'eval-20260730-noah-zimbru-under-2-75')
          bet['updatedAt'] = now
          bet['entryScore'] = 'FC Noah 1-0 Zimbru Chisinau'
          bet['entryAggregateScore'] = 'FC Noah led 2-1 on aggregate'
          bet['entryMinute'] = '34:23 first half'
          bet['modelRecommendation'] = {
              'recommendationType': 'official bet',
              'modelVersion': 'football-v0.2.7',
              'market': 'Under 2.75 total goals',
              'quotedOdds': 2.11,
              'minimumAcceptableOdds': 2.0,
              'stakeUnits': 0.25,
              'state': 'FC Noah led 1-0 at 34:23 of the first half and 2-1 on aggregate. Noah led possession 64%-36%, shots 6-1, shots on target 2-0 and corners 2-0.',
              'reasoning': 'The screenshot already showed Noah leading 1-0. Zimbru were therefore single-goal-to-level, while Noah remained the stronger side with territorial control. Under 2.75 was selected instead of Under 2.5 because exactly three total goals produced only a half loss. The match had seven shots, two on target and minimal Zimbru attacking production at the synchronized entry state.'
          }
          bet['execution'] = {
              'odds': 2.03,
              'stakeUnits': 0.25,
              'stakeVnd': 125000,
              'potentialPayoutVnd': 253750,
              'sameMarketAndLine': True,
              'priceAboveMinimum': True,
              'withinStakeCap': True,
              'stateSynchronized': True,
              'priceMoveClassification': 'normal live price drift',
              'deviations': []
          }
          remove_tags = {'state-change-before-execution', 'unsynchronized-execution', 'model-recommendation-expired'}
          bet['tags'] = [t for t in bet.get('tags', []) if t not in remove_tags]
          for tag in ['official', 'model-generated', 'normal-price-drift', 'screen-read-correction', 'model-screen-read-error']:
              if tag not in bet['tags']:
                  bet['tags'].append(tag)
          bet['processIssue'] = 'The assistant misread the visible 1-0 scoreboard as 0-0 when writing the recommendation. The user execution itself matched the screenshot state, market and line; this was a model screen-reading error, not an execution deviation.'
          bet['notes'] = 'User confirmed sportsbook acceptance of FC Noah vs Zimbru Chisinau full-match Under 2.75 at 2.03 for 0.25u (125,000 VND), slip #870706720962912256. The synchronized screenshot at 34:23 clearly showed FC Noah leading 1-0, with Noah ahead 2-1 on aggregate. The assistant incorrectly transcribed that visible score as 0-0 in the recommendation text. The execution matched the actual screenshot state and is therefore not an unsynchronized or post-goal deviation. Accepted odds remained above the 2.00 cutoff, and the stake respected the 0.25u cap. Potential full-win payout is 253,750 VND and potential profit is 128,750 VND (+0.2575u). Settlement: final total 0-2 goals is a full win; exactly 3 is a half loss with 62,500 VND returned; 4 or more is a full loss. Process flag: model screen-reading error; future live recommendations must verify the scoreboard before pricing aggregate state.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Correct Noah Zimbru entry state to 1-0' || exit 0
          git push
