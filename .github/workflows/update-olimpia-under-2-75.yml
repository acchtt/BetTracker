name: Update Olimpia Under 2.75 bet

on:
  push:
    branches: ["main"]
    paths:
      - ".edgelog-triggers/olimpia-under-2-75.json"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          ledger_path = Path("ledger.json")
          data = json.loads(ledger_path.read_text(encoding="utf-8"))

          timestamp = "2026-07-29T02:43:00Z"
          sync_id = "eval-20260729-olimpia-mixco-under-2-75"
          entry = {
              "syncId": sync_id,
              "updatedAt": timestamp,
              "event": "CD Olimpia vs Deportivo Mixco",
              "league": "CONCACAF Central American Cup",
              "bet": "Under 2.75 total goals",
              "odds": 1.89,
              "stakeVnd": 250000,
              "payoutVnd": 0,
              "status": "open",
              "result": "Pending",
              "eventDate": "2026-07-29",
              "marketType": "Totals",
              "timing": "live",
              "tags": [
                  "evaluation",
                  "official",
                  "live-read",
                  "model-generated",
                  "totals",
                  "quarter-goal",
                  "below-model-cutoff",
                  "max-standard-stake"
              ],
              "notes": "Evaluation bet #26 — live full-match Under 2.75 placed with CD Olimpia leading 1–0 around 32:40 at odds 1.89 for 0.5u (250,000 VND); sportsbook slip #870134281568739328. The model recommendation was Under 2.75 at 1.94 with a minimum acceptable price of 1.90, so execution at 1.89 was 0.01 below cutoff and is tracked as below-cutoff execution. Match evidence at entry: combined xG 0.59, Olimpia 0.52 and Mixco 0.07; shots 6–4, shots on target 4–1, big chances 1–0, box touches 14–3 and box shots 4–1. Potential payout 472,500 VND and potential full-win profit 222,500 VND. Settlement: two or fewer total goals is a full win; exactly three total goals is a half loss; four or more total goals is a full loss."
          }

          bets = data.setdefault("bets", [])
          for index, bet in enumerate(bets):
              if bet.get("syncId") == sync_id:
                  bets[index] = entry
                  break
          else:
              bets.insert(0, entry)

          data["version"] = timestamp
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

      - name: Commit update and clean trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git rm -f .edgelog-triggers/olimpia-under-2-75.json .github/workflows/update-olimpia-under-2-75.yml
          git commit -m "Record Olimpia Mixco Under 2.75 official bet"
          git push
