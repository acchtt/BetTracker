name: Finalize Ferencvaros Twente

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-ferencvaros-twente.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize result and stats
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = '2026-07-30T20:26:00Z'
          target = 'eval-20260731-ferencvaros-twente-under-3'

          for bet in data.get('bets', []):
              if bet.get('syncId') != target:
                  continue
              bet['updatedAt'] = now
              bet['result'] = 'Ferencvaros 2-2 FC Twente after 90 minutes (Loss; Under 3 total goals)'
              bet['finalScore'] = 'Ferencvaros 2-2 FC Twente'
              bet['finalAggregateAfter90'] = 'Ferencvaros won 4-3 on aggregate and advanced'
              bet['finalTotalGoals'] = 4
              bet.pop('finalTotalGoalsMinimumConfirmed', None)
              bet['finalStats'] = {
                  'xG': 'Ferencvaros 1.51-1.48 FC Twente',
                  'possession': 'Ferencvaros 33%-67% FC Twente',
                  'shots': 'Ferencvaros 5-21 FC Twente',
                  'shotsOnTarget': 'Ferencvaros 3-4 FC Twente',
                  'bigChances': 'Ferencvaros 3-3 FC Twente',
                  'corners': 'Ferencvaros 2-8 FC Twente',
                  'yellowCards': 'Ferencvaros 1-3 FC Twente',
                  'redCards': 'Ferencvaros 1-0 FC Twente',
                  'xGOT': 'Ferencvaros 1.17-1.24 FC Twente',
                  'shotsOffTarget': 'Ferencvaros 1-11 FC Twente',
                  'blockedShots': 'Ferencvaros 1-6 FC Twente',
                  'insideBoxShots': 'Ferencvaros 4-12 FC Twente',
                  'outsideBoxShots': 'Ferencvaros 1-9 FC Twente',
                  'woodwork': 'Ferencvaros 0-0 FC Twente',
                  'headedGoals': 'Ferencvaros 0-2 FC Twente',
                  'oppositionBoxTouches': 'Ferencvaros 15-31 FC Twente',
                  'accurateThroughPasses': 'Ferencvaros 1-0 FC Twente',
                  'offsides': 'Ferencvaros 0-1 FC Twente',
                  'freeKicks': 'Ferencvaros 12-10 FC Twente',
                  'passAccuracy': 'Ferencvaros 71%-87% FC Twente',
                  'longPassAccuracy': 'Ferencvaros 49%-53% FC Twente',
                  'finalThirdPassAccuracy': 'Ferencvaros 67%-82% FC Twente',
                  'crossAccuracy': 'Ferencvaros 22%-21% FC Twente',
                  'xA': 'Ferencvaros 0.79-1.51 FC Twente',
                  'throwIns': 'Ferencvaros 15-19 FC Twente',
                  'fouls': 'Ferencvaros 10-12 FC Twente',
                  'tackleSuccess': 'Ferencvaros 65%-71% FC Twente',
                  'duelsWon': 'Ferencvaros 59-51 FC Twente',
                  'clearances': 'Ferencvaros 43-18 FC Twente',
                  'interceptions': 'Ferencvaros 11-3 FC Twente',
                  'errorsLeadingToShot': 'Ferencvaros 1-0 FC Twente',
                  'errorsLeadingToGoal': 'Ferencvaros 0-0 FC Twente'
              }
              bet['notes'] = bet.get('notes', '').replace('Exact final score has not yet been separately confirmed.', 'Final score confirmed from the supplied full-time screenshot: Ferencvaros 2-2 FC Twente, aggregate 4-3 to Ferencvaros. Final statistics were transcribed from the supplied screen.')
              bet['review']['finalStatsAssessment'] = 'The final statistics confirm the red-card and multi-goal-chase danger: Twente had 67% possession, 21 shots, 12 inside-box attempts, 31 box touches, eight corners and 1.48 xG. Ferencvaros still created three big chances and 1.51 xG, so both transition and chase branches contributed to the four-goal outcome.'
              if 'final-stats-verified' not in bet['tags']:
                  bet['tags'].append('final-stats-verified')
              break

          data['version'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m 'Finalize Ferencvaros Twente result and stats' || exit 0
          git push
