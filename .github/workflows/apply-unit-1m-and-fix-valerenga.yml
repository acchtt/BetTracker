name: Apply 1m unit convention and fix Valerenga attribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-unit-1m-and-fix-valerenga.yml
      - TRIGGER_UNIT_1M

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update unit convention, procedure, and ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          effective = '2026-08-01'
          updated_at = '2026-07-31T17:12:00Z'

          ledger_path = Path('ledger.json')
          data = json.loads(ledger_path.read_text(encoding='utf-8'))
          slip_id = '871076012434309120'
          for bet in data.get('bets', []):
              if str(bet.get('slipId', '')) != slip_id:
                  continue
              bet['updatedAt'] = updated_at
              bet['unitValueVndAtPlacement'] = 1000000
              bet['stakeUnits'] = 0.25
              execution = bet.setdefault('execution', {})
              execution['stakeUnits'] = 0.25
              execution['withinFootballStakeCap'] = True
              execution['withinModelStakeRecommendation'] = False
              execution['stateSynchronized'] = False
              execution['attributionTier'] = 'model-timing-failure-with-stake-deviation'
              execution['deviations'] = [
                  'Model recommendation arrived after kickoff; the match had already started before the pick was delivered',
                  'No fresh synchronized live-state snapshot was available at the time of execution',
                  'Placed 0.25u versus the LEAN — SMALL recommendation of 0.125u'
              ]
              bet['entryMinute'] = 'not supplied; match already started when recommendation arrived'
              tags = [t for t in bet.get('tags', []) if t not in {
                  'user-executed-deviation',
                  'stake-above-football-cap',
                  'unsynchronized-execution'
              }]
              for tag in [
                  'model-timing-failure',
                  'late-recommendation',
                  'stake-above-lean-recommendation',
                  'within-football-cap',
                  'unit-basis-1000000-vnd'
              ]:
                  if tag not in tags:
                      tags.append(tag)
              bet['tags'] = tags
              bet['notes'] = (
                  'User confirmed accepted slip #871076012434309120: live Under 3 at 2.10, entry score 0-0, '
                  'stake 250,000 VND and potential return 525,000 VND. Under the unit convention effective '
                  '2026-08-01, 1u = 1,000,000 VND, so the stake is 0.25u. The model pick arrived after kickoff '
                  'without a fresh synchronized live-state snapshot; this is attributed as a model timing failure. '
                  'The stake remained above the LEAN — SMALL recommendation of 0.125u but did not exceed the 0.25u football cap.'
              )
              break
          data['version'] = updated_at
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          football = Path('FOOTBALL_BETTING_PROCEDURE.md')
          if football.exists():
              text = football.read_text(encoding='utf-8')
              text = text.replace('- 1 unit = 500,000 VND.', '- 1 unit = 1,000,000 VND, effective 2026-08-01.')
              text = text.replace('- Standard evaluation stake is 0.25u = 125,000 VND.', '- Standard evaluation stake is 0.25u = 250,000 VND. `LEAN — SMALL` is 0.125u = 125,000 VND.')
              if 'Historical bets retain the unit value in force at placement' not in text:
                  marker = '- The active football-model restriction caps recommendations at 0.25u until the scheduled review is completed.\n'
                  replacement = marker + '- Historical bets retain the unit value in force at placement. Do not sum unit results across different unit regimes without separating them; use VND for all-time reporting.\n'
                  text = text.replace(marker, replacement, 1)
              football.write_text(text, encoding='utf-8')

          lol = Path('LOL_BETTING_PROCEDURE.md')
          if lol.exists():
              text = lol.read_text(encoding='utf-8')
              text = text.replace('1 unit = 500,000 VND', '1 unit = 1,000,000 VND, effective 2026-08-01')
              text = text.replace('0.25u = 125,000 VND', '0.25u = 250,000 VND')
              lol.write_text(text, encoding='utf-8')

          changelog = Path('MODEL_CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text(encoding='utf-8')
              text = text.replace('- 1 unit = 500,000 VND.', '- 1 unit = 1,000,000 VND from 2026-08-01. Historical wagers retain their placement-time unit basis; all-time reporting should use VND and separate unit regimes.')
              marker = '## Unit convention update — 2026-08-01'
              if marker not in text:
                  entry = '''## Unit convention update — 2026-08-01

**Status:** Active project-wide operational convention

- 1u is now 1,000,000 VND.
- Standard 0.25u stake is 250,000 VND.
- `LEAN — SMALL` 0.125u stake is 125,000 VND.
- Historical wagers keep the unit value used at placement; do not retroactively rewrite their unit results.
- For performance spanning multiple unit regimes, VND is authoritative and unit results must be reported separately by regime.
- The Valerenga vs HamKam Under 3 slip was corrected from 0.5u to 0.25u and its late delivery was attributed to model timing rather than user execution.

---

'''
                  first_sep = text.find('---\n')
                  if first_sep == -1:
                      text = text.rstrip() + '\n\n---\n\n' + entry
                  else:
                      insert_at = first_sep + len('---\n')
                      text = text[:insert_at] + '\n' + entry + text[insert_at:]
              changelog.write_text(text, encoding='utf-8')

      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json MODEL_CHANGELOG.md FOOTBALL_BETTING_PROCEDURE.md
          if [ -f LOL_BETTING_PROCEDURE.md ]; then git add LOL_BETTING_PROCEDURE.md; fi
          git commit -m 'Set 1u to 1m VND and correct Valerenga timing attribution' || exit 0
          git push

# trigger: 2026-08-01T00:12+07:00
